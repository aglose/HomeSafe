# /etc/systemd/system/docker.service.d/wait-for-recordings.conf
# Start Docker after the 4 TB recording drive is mounted. The drive is `nofail` in fstab so a dead
# drive can't stop the box booting; without this, Docker could start first and Frigate would record
# onto the 441 GB boot disk. Wants, not Requires: with the drive gone, the relay still starts and
# says so, and Frigate itself refuses to start (its storage bind mount has create_host_path: false).
[Unit]
Wants=mnt-surveillance.mount
After=mnt-surveillance.mount
