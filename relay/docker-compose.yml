# HomeSafe push relay: watches Frigate's alerts and pushes them to the phones via Firebase.
# Host networking so it can reach Frigate on 127.0.0.1 and listen on 8787 for the app.
services:
  homesafe-relay:
    build: .
    container_name: homesafe-relay
    # always, not unless-stopped: a container someone once `docker stop`ped stays down across a
    # reboot under unless-stopped (both containers did on 2026-09-09).
    restart: always
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    network_mode: host
    environment:
      FRIGATE_INTERNAL: http://127.0.0.1:5000
      FRIGATE_AUTH: http://127.0.0.1:8971
      FCM_PROJECT: homesafe-percysafe
      FCM_KEY: /secrets/fcm.json
      RELAY_DB: /data/relay.db
      POLL_SECONDS: "5"
      CLIPS_DIR: /clips
      # The car check (relay.py, "car check"): files passing street cars' crops into the
      # classifier's `none` class, and asks the vision model below about cars in the driveway.
      CAR_CLASSIFIER: known_cars
      # The person check (relay.py, "person check"): grows a `person`/`none` classifier from the
      # detections marked "Not a person" and the faces Frigate names. Idle until Frigate has the
      # model (see docs/phantom-people.md).
      PERSON_CLASSIFIER: person_check
      OLLAMA_URL: http://127.0.0.1:11434
      VLM_MODEL: qwen3-vl:4b-instruct
      # How each household car looks, by the classifier's category, checked against its training
      # images 2026-09-24. A colour list is every colour a camera may see it as. A car missing here is never judged.
      HOUSEHOLD_CARS: >-
        {"andrews_tesla": {"make": "tesla", "colour": ["blue", "black"]},
         "sarahs_car": {"make": "tesla", "colour": "red"},
         "yayas_car": {"colour": ["white", "silver"]},
         "in-laws_mercedes": {"make": "mercedes", "colour": "silver"}}
      # Google Home (relay.py, "Google Home"): where Tailscale Funnel publishes /google/*, and the
      # go2rtc a display's stream comes from.
      GOOGLE_PUBLIC_URL: https://debian-surveillance.tail4c441a.ts.net
      GO2RTC_URL: http://127.0.0.1:1984
      # The cameras Google may show, each with a go2rtc stream a display can play: Frigate's go2rtc
      # config makes each camera a `*_google` stream on the GPU, 720p Constrained Baseline H.264
      # (inside Google's 480p-1080p, and the only profile a display offers) with the camera's audio.
      GOOGLE_STREAMS: >-
        {"amcrest_1": "amcrest_1_google",
         "hikvision_1": "hikvision_1_google",
         "hikvision_2": "hikvision_2_google"}
      # The notification policy (relay.py, "notification policy"): "shadow" pushes by the old
      # rules and logs what the new ones would do into notify_log; "v2" pushes by the new ones.
      NOTIFY_POLICY: shadow
      # People on these cameras sound at once while someone is home; the rest wait for a summary.
      INSTANT_PERSON_CAMERAS: hikvision_1
      # When the summary of what stayed quiet goes out, hours on the household's clock.
      DIGEST_HOURS: "9,12,15,18,21"
      # The door sensors (relay.py, "doors"; docs/doors.md): the Mosquitto broker Zigbee2MQTT
      # publishes to, from server/zigbee. Until it's running the relay tries every 30 s.
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: "1883"
    # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and GOOGLE_PROJECT_ID, only on the box. Without it the
    # Google Home endpoints answer 404.
    # FINANCE_SHEET_ID, the household budget sheet the app's finance section reads (relay.py,
    # "finance"; docs/finance.md), only on the box too. Without it /finance/sheet says so.
    env_file:
      - path: google-home.env
        required: false
      - path: finance.env
        required: false
      # PLAID_CLIENT_ID, PLAID_SECRET and FINANCE_FEED_SHEET_ID (relay.py, "bank sync";
      # docs/bank-sync.md), only on the box. Without the first two the bank sync is off.
      # Which of the budget sheet's cells the balances are typed into is data/sheet-fill.json
      # (relay.py, "sheet fill"), only on the box as well.
      - path: plaid.env
        required: false
      # AMAZON_GMAIL_CLIENT_ID, AMAZON_GMAIL_CLIENT_SECRET and AMAZON_GMAIL_TOKENS (relay.py,
      # "Amazon orders"; docs/budget.md), written by relay/gmail_link.py, only on the box.
      # Without them Amazon's charges say nothing of what was ordered.
      - path: amazon.env
        required: false
      # TESLA_CLIENT_ID, TESLA_CLIENT_SECRET and TESLA_CARS (docs/tesla.md), only on the box.
      - path: tesla.env
        required: false
      # TIMELINE_DRIVE_FOLDER and TIMELINE_PLACES_KEY (relay.py, "timeline"; docs/atlas.md), only on
      # the box. Without the first no export is fetched; without the second places go unnamed.
      - path: timeline.env
        required: false
      # APNS_KEY_ID (relay.py, "APNs"; docs/notifications.md, "iPhone"), only on the box; the key
      # itself is data/apns-key.p8. Without them the relay can't push to an iPhone.
      - path: apns.env
        required: false
    volumes:
      - ./fcm-service-account.json:/secrets/fcm.json:ro
      # relay.db, timeline.db, the vehicle memory's picture of each household car
      # (data/vehicles/), and sheet-fill.json.
      - ./data:/data
      # Frigate's clips (same drive Frigate mounts at /media/frigate), for adding tagged cars to a
      # classifier's dataset; see add_classification_example.
      - /mnt/surveillance/frigate/clips:/clips
      # tailscaled's LocalAPI socket, for the uptime record (relay.py, "uptime"): whether the box
      # is on the tailnet, and which of the household's devices are. The directory, not the socket:
      # tailscaled makes a new socket each time it restarts, and a mounted file would go stale.
      - /var/run/tailscale:/var/run/tailscale:ro

  # Tesla's Fleet Telemetry server (relay.py, "Tesla telemetry"; docs/tesla.md, "Telemetry"): each
  # household Tesla, whenever it is awake, holds a mutual-TLS connection here and streams where it is
  # and how it stands, and this publishes each value to the broker the relay listens on. Funnel
  # passes 8443 through to 127.0.0.1:4443 untouched, since the TLS has to end here. The certificate
  # and its CA are made on the box (data/telemetry/, not in the repository); the cars trust that CA
  # because the signed configuration names it.
  tesla-telemetry:
    image: tesla/fleet-telemetry:v0.9.5
    container_name: tesla-telemetry
    restart: always
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    network_mode: host
    # The box's own user, who owns the key: the image runs as nobody otherwise.
    user: "1000:1000"
    volumes:
      - ./tesla-telemetry.json:/etc/fleet-telemetry/config.json:ro
      - ./data/telemetry:/certs:ro

  # Local vision model for the car check's second opinion. The relay pulls qwen3-vl:4b-instruct
  # (3.3 GB, ~4.5 GB of VRAM with its context) the first time it runs. One model, one request at a
  # time: the GPU is shared with Frigate's detector and decoders.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
