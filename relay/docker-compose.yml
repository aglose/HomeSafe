# HomeSafe push relay: watches Frigate's alerts and pushes them to the phones via Firebase.
# Host networking so it can reach Frigate on 127.0.0.1 and listen on 8787 for the app.
services:
  homesafe-relay:
    build: .
    container_name: homesafe-relay
    # always, not unless-stopped: a container someone once `docker stop`ped stays down across a
    # reboot under unless-stopped (both containers did on 2026-09-09).
    restart: always
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    network_mode: host
    environment:
      FRIGATE_INTERNAL: http://127.0.0.1:5000
      FRIGATE_AUTH: http://127.0.0.1:8971
      FCM_PROJECT: homesafe-percysafe
      FCM_KEY: /secrets/fcm.json
      RELAY_DB: /data/relay.db
      POLL_SECONDS: "5"
      CLIPS_DIR: /clips
      # The car check (relay.py, "car check"): files passing street cars' crops into the
      # classifier's `none` class, and asks the vision model below about cars in the driveway.
      CAR_CLASSIFIER: known_cars
      OLLAMA_URL: http://127.0.0.1:11434
      VLM_MODEL: qwen3-vl:4b-instruct
      # How each household car looks, by the classifier's category, checked against its training
      # images 2026-09-24. A colour list is every colour a camera may see it as. A car missing here is never judged.
      HOUSEHOLD_CARS: >-
        {"andrews_tesla": {"make": "tesla", "colour": ["blue", "black"]},
         "sarahs_car": {"make": "tesla", "colour": "red"},
         "yayas_car": {"colour": ["white", "silver"]},
         "in-laws_mercedes": {"make": "mercedes", "colour": "silver"}}
      # Google Home (relay.py, "Google Home"): where Tailscale Funnel publishes /google/*, and the
      # go2rtc a display's stream comes from.
      GOOGLE_PUBLIC_URL: https://debian-surveillance.tail4c441a.ts.net
      GO2RTC_URL: http://127.0.0.1:1984
      # The cameras Google may show, each with a go2rtc stream inside Google's 480p-1080p. The Front
      # Door's sub (704x480) fits as is; the Hikvisions' mains are 4K and subs 360p, so Frigate's
      # go2rtc config makes each a 720p Constrained Baseline stream on the GPU (`*_google`).
      GOOGLE_STREAMS: >-
        {"amcrest_1": "amcrest_1_sub",
         "hikvision_1": "hikvision_1_google",
         "hikvision_2": "hikvision_2_google"}
    # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and GOOGLE_PROJECT_ID, only on the box. Without it the
    # Google Home endpoints answer 404.
    env_file:
      - path: google-home.env
        required: false
    volumes:
      - ./fcm-service-account.json:/secrets/fcm.json:ro
      - ./data:/data
      # Frigate's clips (same drive Frigate mounts at /media/frigate), for adding tagged cars to a
      # classifier's dataset; see add_classification_example.
      - /mnt/surveillance/frigate/clips:/clips

  # Local vision model for the car check's second opinion. The relay pulls qwen3-vl:4b-instruct
  # (3.3 GB, ~4.5 GB of VRAM with its context) the first time it runs. One model, one request at a
  # time: the GPU is shared with Frigate's detector and decoders.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
