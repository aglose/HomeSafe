<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor plan editor</title>
<style>
:root{--bg:#fcfcfb;--ink:#1a1a19;--muted:#6b6b68;--line:#e4e4e0;--card:#fff;--grid:#ececE8;--grid5:#d6d6d0;--wall:#3d3d3a;--fill:#f3f2ee;--accent:#d9653b;--door:#d9653b;--bad:#d03b3b}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f1f1ee;--muted:#a3a39f;--line:#33332f;--card:#232321;--grid:#262624;--grid5:#34342f;--wall:#e6dcd6;--fill:#2a2a28;--accent:#f0956c;--door:#f0956c}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:17px;margin:0;font-weight:600}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
label{display:flex;gap:6px;align-items:center;color:var(--muted)}
#status{color:var(--muted);margin:0;flex-basis:100%}
#status.bad{color:var(--bad)}
main{flex:1;display:flex;min-height:0}
#plan{flex:1;min-width:0;touch-action:none;user-select:none;-webkit-user-select:none}
aside{width:260px;border-left:1px solid var(--line);padding:14px 16px;overflow:auto}
aside h2{font-size:14px;margin:0 0 10px;font-weight:600}
aside .row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
aside .row span{width:44px;color:var(--muted)}
aside input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
aside p{color:var(--muted);margin:0 0 10px}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:38vh}}
svg text{font-family:system-ui,-apple-system,sans-serif}
</style></head>
<body>
<header>
  <h1>Floor plan</h1>
  <div class="group" id="floors"></div>
  <div class="group" id="tools">
    <button data-tool="move" aria-pressed="true" title="Drag walls, corners, names and stairs (M)">Move</button>
    <button data-tool="wall" aria-pressed="false" title="Drag to draw a wall (W)">Add wall</button>
    <button data-tool="room" aria-pressed="false" title="Click where a room's name goes (R)">Add room name</button>
    <button data-tool="stairs" aria-pressed="false" title="Click where stairs go (S)">Add stairs</button>
    <button data-tool="door" aria-pressed="false" title="Click on a wall to put a door in it (D)">Add door</button>
  </div>
  <div class="group">
    <button id="delete" disabled title="Delete the selected item (Delete)">Delete</button>
    <button id="undo" disabled title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <label><input type="checkbox" id="snap" checked> Snap to ½ ft</label>
    <button id="save" class="primary" disabled>Save</button>
  </div>
  <p id="status">Loading…</p>
</header>
<main>
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
  <aside id="panel"></aside>
</main>
<script>
"use strict";
const svg = document.getElementById("plan"), panel = document.getElementById("panel"), statusLine = document.getElementById("status");
const NS = "http://www.w3.org/2000/svg";
let plan = null, floorIndex = 0, tool = "move", selected = null, drag = null, dirty = false, doors = [];
const history = [];

function say(text, bad) { statusLine.textContent = text; statusLine.className = bad ? "bad" : ""; }
function floor() { return plan.floors[floorIndex]; }
function snapshot() { history.push(JSON.stringify(plan)); if (history.length > 200) history.shift(); document.getElementById("undo").disabled = false; }
function changed() { dirty = true; document.getElementById("save").disabled = false; say("Unsaved changes."); }
function round(v) { return Math.round(v * 100) / 100; }
function snapValue(v) { return document.getElementById("snap").checked ? Math.round(v * 2) / 2 : round(v); }

// A point on the floor that can move: a corner of the outline ({kind: "corner", i}) or one end of
// a wall ({kind: "wall", i, end: "a" | "b"}).
function key(ref) { return ref.kind + ref.i + (ref.end || ""); }
function pointOf(ref) {
  const f = floor();
  if (ref.kind === "corner") return f.outline[ref.i];
  const w = f.walls[ref.i];
  return ref.end === "a" ? [w[0], w[1]] : [w[2], w[3]];
}
function setPoint(ref, p) {
  const f = floor();
  if (ref.kind === "corner") { f.outline[ref.i] = [p[0], p[1]]; return; }
  const w = f.walls[ref.i];
  if (ref.end === "a") { w[0] = p[0]; w[1] = p[1]; } else { w[2] = p[0]; w[3] = p[1]; }
}
function allPoints() {
  const f = floor(), refs = [];
  f.outline.forEach((_, i) => refs.push({ kind: "corner", i }));
  f.walls.forEach((_, i) => { refs.push({ kind: "wall", i, end: "a" }); refs.push({ kind: "wall", i, end: "b" }); });
  return refs;
}
// The points sitting exactly where [ref] does: the walls and corner that meet there move with it.
function joinedTo(ref) {
  const p = pointOf(ref);
  return allPoints().filter(other => key(other) !== key(ref) && Math.hypot(pointOf(other)[0] - p[0], pointOf(other)[1] - p[1]) < 0.01);
}
// Snaps a dragged point to the nearest other corner or wall end within reach, else to the grid.
// [moving] are the keys of the points being dragged, which it mustn't snap to.
function snapPoint(x, y, moving) {
  let best = null, bestDistance = 0.6;
  for (const ref of allPoints()) {
    if (moving && moving.has(key(ref))) continue;
    const p = pointOf(ref), d = Math.hypot(p[0] - x, p[1] - y);
    if (d < bestDistance) { best = p; bestDistance = d; }
  }
  return best ? [best[0], best[1]] : [snapValue(x), snapValue(y)];
}

// Every straight stretch of wall on this floor, outside and in: where a door can go.
function segments() {
  const f = floor(), list = [];
  f.outline.forEach((p, i) => list.push([p, f.outline[(i + 1) % f.outline.length]]));
  f.walls.forEach(w => list.push([[w[0], w[1]], [w[2], w[3]]]));
  return list;
}
// The point of the nearest wall to (x, y), with the wall's direction; null when no wall is within [reach] feet.
function nearestWall(x, y, reach) {
  let best = null;
  for (const [a, b] of segments()) {
    const dx = b[0] - a[0], dy = b[1] - a[1], length = Math.hypot(dx, dy);
    if (length < 0.01) continue;
    const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / (length * length)));
    const px = a[0] + t * dx, py = a[1] + t * dy, d = Math.hypot(px - x, py - y);
    if (d <= reach && (!best || d < best.distance)) best = { distance: d, at: [px, py], dir: [dx / length, dy / length], length };
  }
  return best;
}
// A doorway [width] wide centred on [at] along [dir], its ends on the grid where the wall allows.
function doorway(at, dir, width) {
  const snapAlong = v => document.getElementById("snap").checked ? Math.round(v * 2) / 2 : round(v);
  const centre = Math.abs(dir[0]) >= Math.abs(dir[1]) ? [snapAlong(at[0]), round(at[1])] : [round(at[0]), snapAlong(at[1])];
  const half = width / 2;
  return { from: [round(centre[0] - dir[0] * half), round(centre[1] - dir[1] * half)], to: [round(centre[0] + dir[0] * half), round(centre[1] + dir[1] * half)] };
}
function doorWidth(d) { return Math.hypot(d.to[0] - d.from[0], d.to[1] - d.from[1]); }
function sensorName(id) { const s = doors.find(d => d.id === id); return s ? s.name : null; }

function feetAt(event) {
  const point = svg.createSVGPoint(); point.x = event.clientX; point.y = event.clientY;
  const at = point.matrixTransform(svg.getScreenCTM().inverse());
  return [at.x, at.y];
}

function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(node);
  return node;
}

function bounds(f) {
  const xs = [], ys = [];
  f.outline.forEach(p => { xs.push(p[0]); ys.push(p[1]); });
  (f.walls || []).forEach(w => { xs.push(w[0], w[2]); ys.push(w[1], w[3]); });
  (f.rooms || []).forEach(r => { xs.push(r.x); ys.push(r.y); });
  (f.stairs || []).forEach(s => { xs.push(s[0]); ys.push(s[1]); });
  (f.doors || []).forEach(d => { xs.push(d.from[0], d.to[0]); ys.push(d.from[1], d.to[1]); });
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

function isSelected(kind, i) { return selected && selected.kind === kind && selected.i === i; }

function render() {
  const f = floor();
  svg.innerHTML = "";
  const [l, t, r, b] = bounds(f), m = 4;
  const x0 = Math.floor(l - m), y0 = Math.floor(t - m), x1 = Math.ceil(r + m), y1 = Math.ceil(b + m);
  svg.setAttribute("viewBox", `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
  const css = getComputedStyle(document.documentElement), color = name => css.getPropertyValue(name).trim();
  // The grid: a line a foot, a stronger one every five, numbered.
  for (let x = x0; x <= x1; x++) el("line", { x1: x, y1: y0, x2: x, y2: y1, stroke: color(x % 5 ? "--grid" : "--grid5"), "stroke-width": x % 5 ? 0.04 : 0.07 });
  for (let y = y0; y <= y1; y++) el("line", { x1: x0, y1: y, x2: x1, y2: y, stroke: color(y % 5 ? "--grid" : "--grid5"), "stroke-width": y % 5 ? 0.04 : 0.07 });
  for (let x = Math.ceil(x0 / 5) * 5; x <= x1; x += 5) el("text", { x: x + 0.15, y: y0 + 0.9, "font-size": 0.7, fill: color("--muted") }).textContent = x;
  for (let y = Math.ceil(y0 / 5) * 5; y <= y1; y += 5) el("text", { x: x0 + 0.15, y: y - 0.15, "font-size": 0.7, fill: color("--muted") }).textContent = y;

  el("polygon", { points: f.outline.map(p => p.join(",")).join(" "), fill: color("--fill"), stroke: color("--wall"), "stroke-width": 0.22, "stroke-linejoin": "miter" });
  // The outline's edges, wide and invisible: a double-click on one adds a corner there.
  f.outline.forEach((p, i) => {
    const q = f.outline[(i + 1) % f.outline.length];
    el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: "transparent", "stroke-width": 0.9, "data-kind": "edge", "data-i": i, style: "cursor:copy" });
  });
  (f.walls || []).forEach((w, i) => {
    const on = isSelected("wall", i);
    el("line", { x1: w[0], y1: w[1], x2: w[2], y2: w[3], stroke: on ? color("--accent") : color("--wall"), "stroke-width": on ? 0.2 : 0.14, "stroke-linecap": "square" });
    el("line", { x1: w[0], y1: w[1], x2: w[2], y2: w[3], stroke: "transparent", "stroke-width": 1, "data-kind": "wall", "data-i": i, "data-end": "whole", style: "cursor:move" });
    if (on) {
      const length = Math.hypot(w[2] - w[0], w[3] - w[1]);
      el("text", { x: (w[0] + w[2]) / 2 + 0.3, y: (w[1] + w[3]) / 2 - 0.3, "font-size": 0.8, fill: color("--accent"), "font-weight": 600 }).textContent = `${round(length)} ft`;
    }
    [["a", w[0], w[1]], ["b", w[2], w[3]]].forEach(([end, x, y]) => el("circle", { cx: x, cy: y, r: on ? 0.45 : 0.28, fill: on ? color("--accent") : color("--wall"), "data-kind": "wall", "data-i": i, "data-end": end, style: "cursor:grab" }));
  });
  (f.doors || []).forEach((d, i) => {
    const on = isSelected("door", i), w = doorWidth(d);
    const u = [(d.to[0] - d.from[0]) / w, (d.to[1] - d.from[1]) / w], n = [-u[1] * d.swing, u[0] * d.swing];
    const leaf = [d.from[0] + n[0] * w, d.from[1] + n[1] * w], ink = on ? color("--accent") : color("--door");
    // The opening cut out of the wall, the door standing open, and the arc it swings through.
    el("line", { x1: d.from[0], y1: d.from[1], x2: d.to[0], y2: d.to[1], stroke: color("--fill"), "stroke-width": 0.34 });
    el("line", { x1: d.from[0], y1: d.from[1], x2: leaf[0], y2: leaf[1], stroke: ink, "stroke-width": on ? 0.16 : 0.12 });
    const arc = `M ${d.to[0]} ${d.to[1]} A ${w} ${w} 0 0 ${d.swing === 1 ? 1 : 0} ${leaf[0]} ${leaf[1]}`;
    el("path", { d: arc, fill: "none", stroke: ink, "stroke-width": 0.07, "stroke-dasharray": "0.25 0.15" });
    // Anywhere on the door picks it: the doorway, the open leaf, or inside the arc it swings through.
    const grab = { "data-kind": "door", "data-i": i, "data-end": "whole", style: "cursor:move" };
    el("path", { d: `M ${d.from[0]} ${d.from[1]} L ${d.to[0]} ${d.to[1]} ${arc.slice(arc.indexOf("A"))} Z`, fill: "transparent", stroke: "transparent", "stroke-width": 0.6, ...grab });
    el("line", { x1: d.from[0], y1: d.from[1], x2: d.to[0], y2: d.to[1], stroke: "transparent", "stroke-width": 1, ...grab });
    // A linked sensor is a dot in the doorway's middle; the label is the door's name, else the sensor's.
    if (d.sensor) el("circle", { cx: (d.from[0] + d.to[0]) / 2, cy: (d.from[1] + d.to[1]) / 2, r: 0.42, fill: ink, "pointer-events": "none" });
    const label = d.name || (d.sensor ? sensorName(d.sensor) || "Sensor not paired yet" : "");
    if (label) el("text", { x: (d.from[0] + d.to[0]) / 2 + n[0] * (w + 0.6), y: (d.from[1] + d.to[1]) / 2 + n[1] * (w + 0.6), "font-size": 0.7, "text-anchor": "middle", "dominant-baseline": "middle", fill: ink, "font-weight": 600, ...grab }).textContent = label;
    if (on) [["a", d.from], ["b", d.to]].forEach(([end, p]) => el("circle", { cx: p[0], cy: p[1], r: 0.4, fill: color("--accent"), "data-kind": "door", "data-i": i, "data-end": end, style: "cursor:ew-resize" }));
  });
  (f.stairs || []).forEach((s, i) => {
    const on = isSelected("stairs", i), g = el("g", { "data-kind": "stairs", "data-i": i, style: "cursor:move" });
    el("rect", { x: s[0] - 1.5, y: s[1] - 1.5, width: 3, height: 3, fill: "transparent", stroke: on ? color("--accent") : color("--muted"), "stroke-width": 0.08, "data-kind": "stairs", "data-i": i }, g);
    for (let k = 1; k < 4; k++) el("line", { x1: s[0] - 1.5, y1: s[1] - 1.5 + k * 0.75, x2: s[0] + 1.5, y2: s[1] - 1.5 + k * 0.75, stroke: on ? color("--accent") : color("--muted"), "stroke-width": 0.06, "data-kind": "stairs", "data-i": i }, g);
  });
  (f.rooms || []).forEach((room, i) => {
    const on = isSelected("room", i);
    const text = el("text", { x: room.x, y: room.y, "font-size": 1.05, "text-anchor": "middle", "dominant-baseline": "middle", fill: on ? color("--accent") : color("--ink"), "font-weight": on ? 700 : 500, "data-kind": "room", "data-i": i, style: "cursor:move" });
    text.textContent = room.name;
  });
  f.outline.forEach((p, i) => {
    const on = isSelected("corner", i);
    el("rect", { x: p[0] - 0.35, y: p[1] - 0.35, width: 0.7, height: 0.7, fill: on ? color("--accent") : color("--card"), stroke: on ? color("--accent") : color("--wall"), "stroke-width": 0.08, "data-kind": "corner", "data-i": i, style: "cursor:grab" });
  });
  // The doors placed in the app, for reference: they aren't edited here.
  const onDoorways = new Set(plan.floors.flatMap(fl => (fl.doors || []).map(d => d.sensor).filter(Boolean)));
  doors.filter(d => d.spot && d.spot.floor === f.id && !onDoorways.has(d.id)).forEach(d => {
    el("circle", { cx: d.spot.x, cy: d.spot.y, r: 0.55, fill: color("--door"), opacity: 0.85, "pointer-events": "none" });
    el("text", { x: d.spot.x, y: d.spot.y + 1.4, "font-size": 0.7, "text-anchor": "middle", fill: color("--door"), "pointer-events": "none" }).textContent = d.name;
  });
  if (drag && drag.preview) el("line", { x1: drag.from[0], y1: drag.from[1], x2: drag.preview[0], y2: drag.preview[1], stroke: color("--accent"), "stroke-width": 0.16, "stroke-dasharray": "0.4 0.3" });
  renderPanel();
  document.getElementById("delete").disabled = !selected;
}

// Puts the cursor in the selected item's name, its text selected, ready to type over.
function focusName() { const input = document.getElementById("selected-name"); if (input) { input.focus(); input.select(); } }

function field(label, value, onChange, type, id) {
  const row = document.createElement("div"); row.className = "row";
  const name = document.createElement("span"); name.textContent = label;
  const input = document.createElement("input"); input.type = type || "number"; input.step = "0.5"; input.value = value;
  if (id) input.id = id;
  input.addEventListener("keydown", event => { if (event.key === "Enter") input.blur(); });
  input.addEventListener("change", () => { snapshot(); onChange(type === "text" ? input.value : Number(input.value)); changed(); render(); });
  row.append(name, input); panel.appendChild(row);
}

function renderPanel() {
  const f = floor();
  panel.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = "Floor"; panel.appendChild(h);
  field("Name", f.name, v => { f.name = v.trim() || f.id; renderFloors(); }, "text");
  const hint = document.createElement("p");
  hint.textContent = "Click anything to select it; Delete removes it. Drag with Move: a door slides along the walls, its ends make it wider. Double-click an outside wall to add a corner there, a corner to remove it, a room name or door to rename it. Arrow keys nudge the selection ½ ft (Shift: 0.1 ft).";
  panel.appendChild(hint);
  if (!selected) return;
  const title = document.createElement("h2");
  if (selected.kind === "wall") {
    const w = f.walls[selected.i];
    title.textContent = `Wall · ${round(Math.hypot(w[2] - w[0], w[3] - w[1]))} ft`; panel.appendChild(title);
    field("x1", w[0], v => { w[0] = v; }); field("y1", w[1], v => { w[1] = v; });
    field("x2", w[2], v => { w[2] = v; }); field("y2", w[3], v => { w[3] = v; });
  } else if (selected.kind === "room") {
    const room = f.rooms[selected.i];
    title.textContent = "Room name"; panel.appendChild(title);
    field("Name", room.name, v => { room.name = v.trim() || room.name; }, "text", "selected-name");
    field("x", room.x, v => { room.x = v; }); field("y", room.y, v => { room.y = v; });
  } else if (selected.kind === "stairs") {
    const s = f.stairs[selected.i];
    title.textContent = "Stairs"; panel.appendChild(title);
    field("x", s[0], v => { s[0] = v; }); field("y", s[1], v => { s[1] = v; });
  } else if (selected.kind === "door") {
    const d = f.doors[selected.i];
    title.textContent = `Door · ${round(doorWidth(d))} ft`; panel.appendChild(title);
    field("Name", d.name || "", v => { if (v.trim()) d.name = v.trim(); else delete d.name; }, "text", "selected-name");
    field("Width", round(doorWidth(d)), v => {
      if (!(v >= 0.5)) return;
      const w = doorWidth(d), u = [(d.to[0] - d.from[0]) / w, (d.to[1] - d.from[1]) / w], c = [(d.from[0] + d.to[0]) / 2, (d.from[1] + d.to[1]) / 2];
      d.from = [round(c[0] - u[0] * v / 2), round(c[1] - u[1] * v / 2)]; d.to = [round(c[0] + u[0] * v / 2), round(c[1] + u[1] * v / 2)];
    });
    const buttons = document.createElement("div"); buttons.className = "row";
    const swing = document.createElement("button"); swing.textContent = "Flip swing";
    swing.addEventListener("click", () => { snapshot(); d.swing = -d.swing; changed(); render(); });
    const hinge = document.createElement("button"); hinge.textContent = "Flip hinge";
    // Hinged at the other end, opening into the same room.
    hinge.addEventListener("click", () => { snapshot(); [d.from, d.to] = [d.to, d.from]; d.swing = -d.swing; changed(); render(); });
    buttons.append(swing, hinge); panel.appendChild(buttons);
    const sensorRow = document.createElement("div"); sensorRow.className = "row";
    const sensorLabel = document.createElement("span"); sensorLabel.textContent = "Sensor";
    const select = document.createElement("select");
    select.style.cssText = "font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0";
    const option = (value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; select.appendChild(o); };
    option("", doors.length ? "None" : "None (no sensors paired yet)");
    const linkedElsewhere = new Set(plan.floors.flatMap(fl => (fl.doors || []).filter(other => other !== d && other.sensor).map(other => other.sensor)));
    doors.forEach(s => option(s.id, linkedElsewhere.has(s.id) ? `${s.name} (on another door)` : s.name));
    if (d.sensor && !doors.some(s => s.id === d.sensor)) option(d.sensor, "Not paired yet");
    select.value = d.sensor || "";
    select.addEventListener("change", () => { snapshot(); if (select.value) d.sensor = select.value; else delete d.sensor; changed(); render(); });
    sensorRow.append(sensorLabel, select); panel.appendChild(sensorRow);
    const note = document.createElement("p");
    note.textContent = "A linked sensor's dot goes in the middle of this doorway when you Save.";
    panel.appendChild(note);
  } else if (selected.kind === "corner") {
    const p = f.outline[selected.i];
    title.textContent = `Corner ${selected.i + 1} of ${f.outline.length}`; panel.appendChild(title);
    field("x", p[0], v => { p[0] = v; }); field("y", p[1], v => { p[1] = v; });
  }
}

function renderFloors() {
  const box = document.getElementById("floors"); box.innerHTML = "";
  plan.floors.forEach((f, i) => {
    const b = document.createElement("button"); b.textContent = f.name; b.setAttribute("aria-pressed", i === floorIndex);
    b.addEventListener("click", () => { floorIndex = i; selected = null; renderFloors(); render(); });
    box.appendChild(b);
  });
}

function hit(event) {
  const target = event.target.closest("[data-kind]");
  return target ? { kind: target.dataset.kind, i: Number(target.dataset.i), end: target.dataset.end } : null;
}

svg.addEventListener("pointerdown", event => {
  const f = floor(), at = feetAt(event), target = hit(event);
  svg.setPointerCapture(event.pointerId);
  if (tool === "wall") {
    drag = { kind: "new-wall", from: snapPoint(at[0], at[1], null), preview: null };
    return;
  }
  if (tool === "room") {
    // Placed at once as "Room", its name ready to type over in the side panel.
    snapshot(); f.rooms = f.rooms || []; f.rooms.push({ name: "Room", x: snapValue(at[0]), y: snapValue(at[1]) });
    selected = { kind: "room", i: f.rooms.length - 1 }; setTool("move"); changed(); render(); focusName(); return;
  }
  if (tool === "door") {
    const wall = nearestWall(at[0], at[1], 2);
    if (!wall) { say("Click on a wall (or close to one) to put a door in it.", true); return; }
    snapshot(); f.doors = f.doors || [];
    f.doors.push({ ...doorway(wall.at, wall.dir, Math.min(3, wall.length)), swing: 1 });
    selected = { kind: "door", i: f.doors.length - 1 }; setTool("move"); changed(); render(); return;
  }
  if (tool === "stairs") {
    snapshot(); f.stairs = f.stairs || []; f.stairs.push([snapValue(at[0]), snapValue(at[1])]); selected = { kind: "stairs", i: f.stairs.length - 1 }; changed(); render(); return;
  }
  if (!target || target.kind === "edge") { selected = null; render(); return; }
  selected = { kind: target.kind, i: target.i };
  drag = { ...target, start: at, before: JSON.stringify(plan), moved: false };
  if (target.kind === "door") drag.original = JSON.parse(JSON.stringify(f.doors[target.i]));
  else if (target.kind === "room") drag.original = { ...f.rooms[target.i] };
  else if (target.kind === "stairs") drag.original = [...f.stairs[target.i]];
  else {
    // The points that move: the corner or wall end grabbed (both ends for a whole wall), and
    // whatever meets each of them, so a joint stays joined and attached walls stretch.
    const grabbed = target.kind === "corner" ? [{ kind: "corner", i: target.i }]
      : target.end === "whole" ? [{ kind: "wall", i: target.i, end: "a" }, { kind: "wall", i: target.i, end: "b" }]
      : [{ kind: "wall", i: target.i, end: target.end }];
    drag.points = [];
    // An inside wall never drags the outside ones with it; an outside corner does pull the inside walls that end there.
    grabbed.forEach(ref => [ref, ...joinedTo(ref).filter(r => target.kind === "corner" || r.kind !== "corner")].forEach(r => {
      if (!drag.points.some(m => key(m.ref) === key(r))) drag.points.push({ ref: r, from: [...pointOf(r)] });
    }));
    drag.moving = new Set(drag.points.map(m => key(m.ref)));
  }
  render();
});

svg.addEventListener("pointermove", event => {
  if (!drag) return;
  const f = floor(), at = feetAt(event);
  if (drag.kind === "new-wall") { drag.preview = snapPoint(at[0], at[1], null); render(); return; }
  const dx = at[0] - drag.start[0], dy = at[1] - drag.start[1];
  if (!drag.moved && Math.hypot(dx, dy) < 0.15) return;
  drag.moved = true;
  const o = drag.original;
  if (drag.kind === "door") {
    const d = f.doors[drag.i], w = doorWidth(o), u = [(o.to[0] - o.from[0]) / w, (o.to[1] - o.from[1]) / w];
    if (drag.end === "whole") {
      // The doorway slides along walls: its middle follows the pointer to the nearest wall, turning to match it.
      const c = [(o.from[0] + o.to[0]) / 2 + dx, (o.from[1] + o.to[1]) / 2 + dy], wall = nearestWall(c[0], c[1], 3);
      if (wall) {
        const flipped = wall.dir[0] * u[0] + wall.dir[1] * u[1] < 0, dir = flipped ? [-wall.dir[0], -wall.dir[1]] : wall.dir;
        Object.assign(d, doorway(wall.at, dir, Math.min(w, wall.length)));
      }
    } else {
      // An end drags along the doorway's own line: wider or narrower, never off the wall.
      const fixed = drag.end === "a" ? o.to : o.from, moving = drag.end === "a" ? o.from : o.to;
      const along = (moving[0] + dx - fixed[0]) * u[0] + (moving[1] + dy - fixed[1]) * u[1];
      const sign = drag.end === "a" ? -1 : 1, length = Math.max(0.5, snapValue(Math.abs(along)));
      const end = [round(fixed[0] + u[0] * sign * length), round(fixed[1] + u[1] * sign * length)];
      if (drag.end === "a") d.from = end; else d.to = end;
    }
  } else if (drag.kind === "room") { const room = f.rooms[drag.i]; room.x = snapValue(o.x + dx); room.y = snapValue(o.y + dy); }
  else if (drag.kind === "stairs") { f.stairs[drag.i] = [snapValue(o[0] + dx), snapValue(o[1] + dy)]; }
  else {
    // A single point snaps to whatever it's dropped near; a whole wall moves by a snapped step.
    const lead = drag.points[0].from;
    const to = drag.end === "whole" ? [snapValue(lead[0] + dx), snapValue(lead[1] + dy)] : snapPoint(lead[0] + dx, lead[1] + dy, drag.moving);
    const ddx = to[0] - lead[0], ddy = to[1] - lead[1];
    drag.points.forEach(m => setPoint(m.ref, [round(m.from[0] + ddx), round(m.from[1] + ddy)]));
  }
  render();
});

svg.addEventListener("pointerup", () => {
  if (!drag) return;
  const f = floor();
  if (drag.kind === "new-wall") {
    const to = drag.preview;
    if (to && Math.hypot(to[0] - drag.from[0], to[1] - drag.from[1]) >= 0.5) {
      snapshot(); f.walls = f.walls || []; f.walls.push([drag.from[0], drag.from[1], to[0], to[1]]);
      selected = { kind: "wall", i: f.walls.length - 1 }; changed();
    }
  } else if (drag.moved) {
    history.push(drag.before); document.getElementById("undo").disabled = false; changed();
  }
  drag = null; render();
});

svg.addEventListener("dblclick", event => {
  const f = floor(), target = hit(event), at = feetAt(event);
  if (!target) return;
  if (target.kind === "edge") {
    snapshot(); f.outline.splice(target.i + 1, 0, [snapValue(at[0]), snapValue(at[1])]); selected = { kind: "corner", i: target.i + 1 }; changed(); render();
  } else if (target.kind === "corner" && f.outline.length > 3) {
    snapshot(); f.outline.splice(target.i, 1); selected = null; changed(); render();
  } else if (target.kind === "room" || target.kind === "door") {
    selected = { kind: target.kind, i: target.i }; render(); focusName();
  }
});

function deleteSelected() {
  const f = floor();
  if (!selected) return;
  if (selected.kind === "corner" && f.outline.length <= 3) { say("A floor needs at least three corners.", true); return; }
  snapshot();
  ({ wall: f.walls, room: f.rooms, stairs: f.stairs, corner: f.outline, door: f.doors })[selected.kind].splice(selected.i, 1);
  selected = null; changed(); render();
}

function nudge(dx, dy) {
  const f = floor();
  if (!selected) return;
  snapshot();
  const move = p => [round(p[0] + dx), round(p[1] + dy)];
  if (selected.kind === "wall") { const w = f.walls[selected.i]; const a = move([w[0], w[1]]), b = move([w[2], w[3]]); f.walls[selected.i] = [...a, ...b]; }
  else if (selected.kind === "room") { const room = f.rooms[selected.i]; room.x = round(room.x + dx); room.y = round(room.y + dy); }
  else if (selected.kind === "stairs") f.stairs[selected.i] = move(f.stairs[selected.i]);
  else if (selected.kind === "door") { const d = f.doors[selected.i]; d.from = move(d.from); d.to = move(d.to); }
  else f.outline[selected.i] = move(f.outline[selected.i]);
  changed(); render();
}

function undo() {
  if (!history.length) return;
  plan = JSON.parse(history.pop()); floorIndex = Math.min(floorIndex, plan.floors.length - 1); selected = null;
  document.getElementById("undo").disabled = !history.length; changed(); renderFloors(); render();
}

function setTool(name) {
  tool = name;
  document.querySelectorAll("#tools button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === name));
  svg.style.cursor = name === "move" ? "default" : "crosshair";
}

document.querySelectorAll("#tools button").forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));
document.getElementById("delete").addEventListener("click", deleteSelected);
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("save").addEventListener("click", save);
document.addEventListener("keydown", event => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName)) return;
  const step = event.shiftKey ? 0.1 : 0.5;
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") { event.preventDefault(); undo(); }
  else if (event.key === "Delete" || event.key === "Backspace") { event.preventDefault(); deleteSelected(); }
  else if (event.key === "ArrowLeft") { event.preventDefault(); nudge(-step, 0); }
  else if (event.key === "ArrowRight") { event.preventDefault(); nudge(step, 0); }
  else if (event.key === "ArrowUp") { event.preventDefault(); nudge(0, -step); }
  else if (event.key === "ArrowDown") { event.preventDefault(); nudge(0, step); }
  else if (event.key === "Escape") { selected = null; drag = null; render(); }
  else if (!event.metaKey && !event.ctrlKey && !event.altKey) {
    const shortcut = { m: "move", w: "wall", r: "room", s: "stairs", d: "door" }[event.key.toLowerCase()];
    if (shortcut) setTool(shortcut);
  }
});
window.addEventListener("beforeunload", event => { if (dirty) { event.preventDefault(); event.returnValue = ""; } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => plan && render());

async function save() {
  const button = document.getElementById("save");
  button.disabled = true; say("Saving…");
  try {
    const r = await fetch("/floorplan", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(plan), credentials: "include" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) { say(`Couldn't save: ${body.detail || r.status}`, true); button.disabled = false; return; }
    plan = body; dirty = false;
    say("Saved. Pull to refresh on the app's Doors page to see it there.");
    renderFloors(); render();
  } catch (e) { say(`Couldn't reach the relay: ${e}`, true); button.disabled = false; }
}

async function load() {
  try {
    const r = await fetch("/floorplan", { credentials: "include" });
    if (r.status === 401) { statusLine.innerHTML = 'Sign in to Frigate in this browser first: <a href="http://' + location.hostname + ':8971/">open Frigate</a>, then reload this page.'; return; }
    if (r.status === 404) {
      plan = { floors: [{ id: "first", name: "First floor", outline: [[0, 0], [30, 0], [30, 40], [0, 40]], rooms: [], stairs: [], walls: [], doors: [] }] };
      say("There's no floor plan on the box yet: this is a starting square. Shape it and Save.");
    } else if (!r.ok) { say(`The relay answered ${r.status}.`, true); return; }
    else { plan = await r.json(); say("Saved plan loaded. Changes stay here until you Save."); }
    plan.floors.forEach(f => { f.rooms = f.rooms || []; f.stairs = f.stairs || []; f.walls = f.walls || []; f.doors = f.doors || []; });
    const d = await fetch("/doors", { credentials: "include" }).catch(() => null);
    if (d && d.ok) doors = (await d.json()).doors || [];
    renderFloors(); render();
  } catch (e) { say(`Couldn't reach the relay: ${e}`, true); }
}
load();
</script>
</body></html>
