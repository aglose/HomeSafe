#Kotlin
kotlin.code.style=official
# 4 GB: the whole-world Wasm link of :webApp ran the 3 GB daemon out of heap on CI ("GC overhead
# limit exceeded" in compileDevelopmentExecutableKotlinWasmJs) with no code change behind it.
kotlin.daemon.jvmargs=-Xmx4096M
# Kotlin/Native incremental compilation (experimental in 2.4.20): debug iOS framework links
# recompile only what changed instead of the whole shared module. Needs no code changes; if an
# iOS build misbehaves, set this to false to rule it out and report at https://kotl.in/issue.
kotlin.incremental.native=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Compose Preview Screenshot Testing as an AGP test suite (:androidApp's src/screenshotTest; see
# docs/ui-previews.md). Both flags are experimental in AGP 9.5.
android.experimental.enableScreenshotTest=true
android.experimental.testSuiteSupport=true

#App version
# The Android versionName is "<appVersionBase>.<PR number>" for a Play release: the publish job in
# .github/workflows/ci.yml passes -PreleasePr, and the "App version" workflow writes the same
# string into each PR's description. A local build is plain appVersionBase. Bump it by hand for
# a release worth a new major/minor; the PR number keeps counting either way.
appVersionBase=1.0
