# The device tests on apksim (https://github.com/aglose/apksim) instead of an emulator: Android's
# framework running on the JVM in one Linux container, no KVM, no boot, no installs. Every module's
# device tests, the whole-app journeys and the end-to-end tests, the same APKs an emulator installs.
# CI's android-ui job calls it on every pull request and push to main (it is what ci-green waits
# for), and the nightly run calls it beside the emulators to check the two still agree
# (device-tests-nightly.yml). apksim is pinned to a release of its published image (APKSIM_IMAGE);
# a new release can change how apps translate, so move it on purpose.
name: Device tests on apksim

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apksim:
    name: Device tests on apksim (no emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APKSIM_IMAGE: ghcr.io/aglose/apksim:0.5.0
    steps:
      - uses: actions/checkout@v7
      # Pulled beside the build, so it is ready when the APKs are.
      - name: Pull apksim's image
        run: docker pull --quiet "$APKSIM_IMAGE" > pull.log 2>&1 &
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build the test APKs
        run: ./gradlew assembleAndroidDeviceTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --stacktrace

      # A failure is run once more in a process of its own; one that passes then is reported as
      # flaky (a warning and the summary) rather than failing the job. See the script.
      - name: Device tests
        run: |
          docker pull --quiet "$APKSIM_IMAGE"
          scripts/ci/apksim-device-tests.py "$APKSIM_IMAGE" apksim-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apksim-results
          path: apksim-results/**
          retention-days: 7
