name: CI

# Shape of the pipeline: every Gradle task set that can run on its own gets its own runner
# (the `gradle` matrix below), the emulator and iOS jobs run beside them, and ci-green fans
# everything back into the one required status check.
#
# The app is Android and iOS: :shared (the core), the feature modules under features/ and :app
# (the composition root). Task names without a project path (`testAndroidHostTest`,
# `stabilityCheck`, `ktlintCheck`, `iosSimulatorArm64Test`) run in every module that has them.

# workflow_dispatch is how the "Dependency updates" workflow starts a run: on a Dependabot branch
# after it has pushed a commit there, and on main after it has merged one. Both of those are done
# with GITHUB_TOKEN, and GitHub starts no pull_request or push run for anything GITHUB_TOKEN does.
# A run started that way on main publishes like a push to main does.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new run on a ref cancels the one before it. A run started again (a second attempt, by hand or
# by "Retry CI on main") does not: it waits its turn instead. On main it may be an older commit's
# run that is being tried again, and it must not take the place of the newest commit's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  gradle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            # Every module's commonTest, on the Android host. --continue: one module's failures
            # don't stop the others', so one run reports everything that is broken.
            # :fake-frigate:test checks the fake server the journeys sign in to, so a broken fake
            # fails on its own rather than as fifty journeys on the emulator.
            # The Compose UI tests and the journeys run on the emulator (android-ui) and the iOS
            # simulator (ios), the two runtimes that can host them.
            tasks: :fake-frigate:test testAndroidHostTest --continue
            artifact: unit-test-reports
            reports: |
              shared/build/reports/tests/**
              shared/build/test-results/**
              features/*/build/reports/tests/**
              features/*/build/test-results/**
              app/build/reports/tests/**
              app/build/test-results/**
              fake-frigate/build/reports/tests/**
          - name: Android build, lint and stability gate
            # All three share every module's Android compilation, so they belong on one runner.
            # Each module with composables has its own stability baseline (<module>/stability).
            tasks: :androidApp:assembleDebug :androidApp:lintDebug stabilityCheck
            artifact: android-reports
            reports: |
              androidApp/build/reports/**
              shared/build/reports/**
              features/*/build/reports/**
              app/build/reports/**
          - name: Kotlin style
            # ktlint + compose-rules. Needs no compilation (its tasks are handed only the
            # hand-written sources; see shared/build.gradle.kts), so it is the cheapest leg here
            # and the one that fails fastest on a PR that skipped `./gradlew ktlintFormat`.
            tasks: ktlintCheck
            artifact: ktlint-reports
            reports: |
              shared/build/reports/ktlint/**
              features/*/build/reports/ktlint/**
              app/build/reports/ktlint/**
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Same-repo runs get the real Firebase config; fork PRs get no secrets and build
      # without it (androidApp/build.gradle.kts applies the plugin only when it exists).
      # A Dependabot branch builds without it as well. GitHub already withholds secrets from the
      # run a Dependabot pull request starts; a run the Dependency updates workflow starts on that
      # branch would be handed them, and it is building versions nobody has vetted yet.
      - name: Write google-services.json
        if: ${{ !startsWith(github.ref, 'refs/heads/dependabot/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
            echo "Firebase config written."
          else
            echo "GOOGLE_SERVICES_JSON secret not set; building without Firebase."
          fi


      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.artifact }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.reports }}
          retention-days: 7

  # The relay is deployed by hand, so this is the only place a new version of one of its packages
  # or of its base image is tried before it reaches the box: the image has to build, and relay.py
  # has to import against what was installed (every route and request model is declared at import).
  # relay/test_relay.py stubs the packages out, so it checks the relay's own logic, not them.
  relay:
    name: Relay and CI scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest relay/test_relay.py scripts/ci/test_dependency_gate.py scripts/ci/test_watch_ios_job.py scripts/ci/test_copilot_review.py
      - name: Build the relay image
        run: docker build --tag homesafe-relay relay
      - name: Import the relay against its installed packages
        run: docker run --rm --env FCM_PROJECT=ci homesafe-relay python -c "import relay; print(len(relay.app.routes), 'routes')"

  android-ui:
    name: Android UI tests (emulator, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Two emulators, because one ran the suites for twelve minutes after five of setup. The
    # whole-app journeys (:app's src/integrationTest) are most of the time on a device, so they
    # get one to themselves; every module's other device tests and the end-to-end tests share
    # the other. The split is by test package, so a new test lands on a side without being
    # listed anywhere: in the journeys' package on the first, anywhere else on the second.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: journeys
            tasks: :app:connectedAndroidDeviceTest
            filter: package
          - name: everything else
            # Every module's device tests (connectedAndroidDeviceTest without a project path runs
            # in each), one module after another (see the mustRunAfter in each build script).
            tasks: connectedAndroidDeviceTest :androidApp:connectedDebugAndroidTest
            filter: notPackage
    env:
      API_LEVEL: 34
      JOURNEYS_PACKAGE: com.meticulouscreations.homesafe.integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # KVM is what makes the x86_64 emulator usable on a hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted AVD is cached as a snapshot, so later runs resume it instead of cold-booting.
      # Caches made on main are visible to every branch; a miss only happens the first time
      # the API level changes (or after the cache is evicted), and then costs one extra boot.
      - name: AVD snapshot cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Two suites, over the two emulators of the matrix above:
      # - connectedAndroidDeviceTest — each module's commonTest suite on-device, plus src/uiTest
      #   (Compose UI tests, also run on the iOS simulator) and :app's src/integrationTest
      #   (whole-app journeys against the fake Frigate).
      # - :androidApp:connectedDebugAndroidTest — end-to-end tests on the real MainActivity
      #   (intents, system back, relaunch), one orchestrated instrumentation per test.
      # The package filter is AndroidJUnitRunner's own argument; AGP passes it to every connected
      # task, and the end-to-end tests are in a package of their own, so `notPackage` keeps them.
      # --continue so a failure in the first still reports the second.
      # The script stops Gradle after 45 minutes and, if it had to, dumps the stuck processes'
      # threads, so a hang shows up in this log rather than as a silent job timeout.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/run-instrumented-tests.sh 45 -- ${{ matrix.tasks }} -Pandroid.testInstrumentationRunnerArguments.${{ matrix.filter }}=${{ env.JOURNEYS_PACKAGE }} --continue --stacktrace

      # Connected test tasks print only a count; put each failure (message and stack) in the log.
      - name: Print instrumented test failures
        if: failure()
        run: python3 scripts/print-test-failures.py shared/build/outputs/androidTest-results features/*/build/outputs/androidTest-results app/build/outputs/androidTest-results androidApp/build/outputs/androidTest-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-reports-${{ matrix.filter == 'package' && 'journeys' || 'rest' }}
          path: |
            shared/build/reports/**
            shared/build/outputs/androidTest-results/**
            features/*/build/reports/**
            features/*/build/outputs/androidTest-results/**
            app/build/reports/**
            app/build/outputs/androidTest-results/**
            androidApp/build/reports/**
            androidApp/build/outputs/androidTest-results/**
          retention-days: 7

  # The cold-launch regression gate. Builds the base branch's app and this one's (benchmarkRelease:
  # release bytecode with the fake Frigate's test login), then times both on one emulator,
  # interleaved: process start to first frame, and sign-in to the first live video frame on Home
  # against the fake Frigate plus go2rtc test patterns. Fails when this branch's median is slower
  # by more than 15% (and more than a per-metric floor) — see scripts/ci/startup-perf.sh and
  # "Time to the first live picture" in docs/webrtc-live.md. On a push to main, the base is the
  # commit main was at before. A run started by hand has neither a pull request nor a push to
  # read the base from: on main it is the commit before, on a branch where it left main.
  startup-perf:
    name: Cold launch vs base (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      API_LEVEL: 34
      EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check there is a base to compare against
        id: base
        run: |
          BASE_SHA=$EVENT_BASE_SHA
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              BASE_SHA=$(git rev-parse --quiet --verify 'HEAD^' || true)
            else
              BASE_SHA=$(git merge-base origin/main HEAD || true)
            fi
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No base commit to compare against ($BASE_SHA); nothing to gate."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM
        if: steps.base.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same snapshot as the android-ui job.
      - name: AVD snapshot cache
        if: steps.base.outputs.present == 'true'
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create AVD and snapshot
        if: steps.base.outputs.present == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # ffmpeg draws the test patterns. It is a hundred packages (20 to 70 seconds), so it
      # installs beside the builds below instead of after them; "Start the fake Frigate" waits
      # for it, and installs it itself if this didn't work.
      - name: Install ffmpeg in the background
        if: steps.base.outputs.present == 'true'
        run: |
          nohup sh -c "sudo apt-get update && sudo apt-get install -y ffmpeg; echo \$? > '$RUNNER_TEMP/ffmpeg-install.status'" \
            > "$RUNNER_TEMP/ffmpeg-install.log" 2>&1 &

      # The base's APK is the same whichever run builds it, and the base of most runs is a commit
      # that main's own run has already built as its head ("Keep this commit's benchmark APK"
      # below). The key takes this file's hash because the recipe for the APK is in it (the test
      # login): a pull request that changes this file builds its base itself, as does any run
      # whose base main never finished building.
      - name: The base's benchmark APK, if main's run kept it
        if: steps.base.outputs.present == 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/startup-perf/kept
          key: benchmark-apk-${{ env.BASE_SHA }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # What the benchmarkRelease variant's Autofill button fills in (androidApp/build.gradle.kts):
      # the fake Frigate's admin login, at the address the emulator reaches the runner by.
      - name: Point the test login at the fake Frigate
        if: steps.base.outputs.present == 'true'
        run: printf 'test.serverUrl=http://10.0.2.2:8971\ntest.username=admin\ntest.password=correct-horse\n' > local.credentials.properties

      - name: Build this branch and the fake Frigate
        if: steps.base.outputs.present == 'true'
        run: |
          ./gradlew :androidApp:assembleBenchmarkRelease :fake-frigate:installDist --stacktrace
          mkdir -p build/startup-perf
          cp androidApp/build/outputs/apk/benchmarkRelease/androidApp-benchmarkRelease.apk build/startup-perf/head.apk

      - name: Build the base branch
        if: steps.base.outputs.present == 'true'
        run: |
          if [ -f build/startup-perf/kept/benchmark.apk ]; then
            echo "Using the APK main's run built from $BASE_SHA."
            mv build/startup-perf/kept/benchmark.apk build/startup-perf/base.apk
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cp local.credentials.properties "$RUNNER_TEMP/base/"
          (cd "$RUNNER_TEMP/base" && ./gradlew :androidApp:assembleBenchmarkRelease --stacktrace)
          cp "$RUNNER_TEMP/base/androidApp/build/outputs/apk/benchmarkRelease/androidApp-benchmarkRelease.apk" build/startup-perf/base.apk

      # Saved here rather than when the job ends, so that a run cancelled by the next merge has
      # still left its APK behind. Only main's: no other branch's head becomes a base. That is a
      # push to main, or the run the Dependency updates workflow starts there after a merge.
      - name: Keep this commit's benchmark APK
        if: steps.base.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/startup-perf/kept
          cp build/startup-perf/head.apk build/startup-perf/kept/benchmark.apk
      - name: Save it for the runs this commit is the base of
        if: steps.base.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: build/startup-perf/kept
          key: benchmark-apk-${{ github.sha }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Start the fake Frigate and go2rtc test patterns
        if: steps.base.outputs.present == 'true'
        run: |
          # "Install ffmpeg in the background" has normally finished long before the builds have.
          for _ in $(seq 1 180); do
            [ -f "$RUNNER_TEMP/ffmpeg-install.status" ] && break
            sleep 1
          done
          if ! command -v ffmpeg > /dev/null; then
            echo "::warning::The background ffmpeg install didn't finish; installing it now."
            cat "$RUNNER_TEMP/ffmpeg-install.log" || true
            sudo apt-get -o DPkg::Lock::Timeout=300 update && sudo apt-get -o DPkg::Lock::Timeout=300 install -y ffmpeg
          fi
          nohup fake-frigate/build/install/fake-frigate/bin/fake-frigate --port 8971 --host 0.0.0.0 --advertise 10.0.2.2 \
            > build/startup-perf/fake-frigate.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8971/api/version > /dev/null && break
            [ "$i" = 30 ] && { echo "::error::The fake Frigate did not start"; cat build/startup-perf/fake-frigate.log; exit 1; }
            sleep 1
          done
          scripts/ci/go2rtc-testsrc.sh build/startup-perf

      - name: Compare cold launches
        if: steps.base.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Left on: the sign-in → Home transition is part of what a user waits through.
          disable-animations: false
          script: scripts/ci/startup-perf.sh build/startup-perf/base.apk build/startup-perf/head.apk 4

      - uses: actions/upload-artifact@v7
        if: always() && steps.base.outputs.present == 'true'
        with:
          name: startup-perf
          path: |
            build/bench/**
            build/startup-perf/*.log
            build/startup-perf/failure-screen.*
            build/startup-perf/go2rtc.yaml
          retention-days: 14

  # Where the iOS job runs, decided before it is queued: a job sent to the self-hosted Mac while
  # the Mac is asleep or its runner has stopped waits there for good (up to a day), and ci-green
  # with it. So the Mac is asked first whether it is online, and when it isn't, the job goes to a
  # GitHub-hosted macOS runner instead: slower (it builds from nothing), but it finishes.
  #
  # - A fork's pull request must never execute on the Mac, so it always goes hosted (it needs no
  #   secrets). So does a Dependabot branch, whether the run is its pull request's or one the
  #   Dependency updates workflow started on it: it builds versions of plugins nobody has vetted
  #   yet, and those should run on a machine that is thrown away afterwards.
  # - The repository variable IOS_RUNNER set to `hosted` or `self-hosted` decides outright, for
  #   when the Mac is known to be away (or known to be back).
  # - Otherwise the Mac's status comes from the repository's runner list, which GITHUB_TOKEN may
  #   not read: it takes the secret RUNNER_STATUS_TOKEN, a fine-grained token for this repository
  #   with "Administration: Read-only" and nothing else. With no token, or the list unreadable,
  #   the job goes to the Mac as it always did, with a warning on the run.
  #
  # The Mac can also be online here and still not finish: busy past the point of starting the job,
  # or asleep halfway through it. ios-watch covers that (below).
  #
  # A rerun of only the failed jobs keeps this job's answer; "Re-run all jobs" asks again.
  ios-runner:
    name: Pick the iOS runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
      on-mac: ${{ steps.pick.outputs.on-mac }}
    steps:
      - name: Is the Mac online?
        id: pick
        env:
          UNTRUSTED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || startsWith(github.head_ref, 'dependabot/') || startsWith(github.ref, 'refs/heads/dependabot/') }}
          OVERRIDE: ${{ vars.IOS_RUNNER }}
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -o pipefail
          hosted='"macos-latest"'
          mac='["self-hosted", "macOS"]'
          pick() {
            echo "runs-on=$1" >> "$GITHUB_OUTPUT"
            echo "on-mac=$([ "$1" = "$mac" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "iOS job runs on: $1"
          }

          if [ "$UNTRUSTED" = "true" ]; then
            pick "$hosted"
            exit 0
          fi
          case "$OVERRIDE" in
            hosted)
              echo "::notice::IOS_RUNNER=hosted: the iOS job runs on a GitHub-hosted Mac."
              pick "$hosted"
              exit 0
              ;;
            self-hosted)
              pick "$mac"
              exit 0
              ;;
          esac
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RUNNER_STATUS_TOKEN isn't set, so whether the self-hosted Mac is online can't be checked; the iOS job is sent to it regardless. See the ios-runner job in ci.yml."
            pick "$mac"
            exit 0
          fi
          if ! online=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners" --paginate \
              --jq '[.runners[] | select(.status == "online" and any(.labels[]; .name == "self-hosted") and any(.labels[]; .name == "macOS"))] | length' \
              | awk '{ n += $1 } END { print n + 0 }'); then
            echo "::warning::Couldn't read the repository's runners with RUNNER_STATUS_TOKEN; the iOS job is sent to the self-hosted Mac regardless."
            pick "$mac"
            exit 0
          fi
          if [ "$online" -gt 0 ]; then
            pick "$mac"
          else
            echo "::notice::The self-hosted Mac is offline, so the iOS job runs on a GitHub-hosted Mac instead."
            pick "$hosted"
          fi

  ios:
    name: iOS tests and build
    needs: ios-runner
    runs-on: ${{ fromJSON(needs.ios-runner.outputs.runs-on) }}
    # ci-green reads this job through ios-watch, not directly: a Mac that never picks it up would
    # otherwise hold ci-green for a day, and one that drops off halfway would turn it red although
    # the hosted fallback passed.
    continue-on-error: true
    # The Mac takes a few minutes, with everything already built once. A hosted runner starts
    # from nothing each time: Kotlin/Native to download, and the whole of :shared to compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-tests-and-build

  # Watches the ios job from a hosted runner and says how it went (scripts/ci/watch-ios-job.sh):
  # passed; failed by itself (a test, the build), which fails this job too so that "Re-run failed
  # jobs" runs the pair again; or never finished on the Mac, because it sat queued for 15 minutes
  # or its runner went away partway through (the job then ends with a step still in progress and
  # no log). In that last case ios-hosted runs the same work on a GitHub-hosted Mac. The job left
  # queued on the Mac stays queued until the Mac takes it or GitHub drops it after a day; ci-green
  # doesn't wait for it.
  ios-watch:
    name: Watch the iOS job
    needs: ios-runner
    runs-on: ubuntu-24.04
    # 15 minutes for the Mac to start, the ios job's 60, and the few GitHub takes to notice a
    # runner that went silent.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      result: ${{ steps.watch.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci/watch-ios-job.sh
          sparse-checkout-cone-mode: false
      - name: Wait for the iOS job
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_NAME: iOS tests and build
          ON_MAC: ${{ needs.ios-runner.outputs.on-mac }}
        run: scripts/ci/watch-ios-job.sh

  ios-hosted:
    name: iOS tests and build (GitHub-hosted fallback)
    needs: ios-watch
    if: needs.ios-watch.outputs.result == 'fallback'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-tests-and-build

  ci-green:
    name: ci-green
    # The single required status check. Jobs can be added or renamed without touching
    # branch protection, as long as they are listed here.
    if: always()
    # Not the ios job itself: ios-watch stands for it, and ios-hosted when the Mac couldn't finish.
    needs: [gradle, relay, android-ui, startup-perf, ios-runner, ios-watch, ios-hosted]
    runs-on: ubuntu-24.04
    steps:
      - name: Show job results
        run: echo '${{ toJSON(needs) }}'
      # Every job succeeded, except ios-hosted, which runs only when ios-watch says the Mac didn't
      # finish, and then has to have succeeded.
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.key != "ios-hosted" and .value.result != "success") | "\(.key): \(.value.result)") | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Not every job succeeded: $failed"
            exit 1
          fi
          ios=$(jq -r '.["ios-watch"].outputs.result' <<< "$NEEDS")
          hosted=$(jq -r '.["ios-hosted"].result' <<< "$NEEDS")
          if [ "$ios" = "fallback" ] && [ "$hosted" != "success" ]; then
            echo "::error::The iOS job fell back to a GitHub-hosted Mac, and that run ended $hosted."
            exit 1
          fi
          if [ "$ios" != "passed" ] && [ "$ios" != "fallback" ]; then
            echo "::error::ios-watch said \"$ios\" about the iOS job."
            exit 1
          fi

  publish-internal:
    name: Publish to Play internal testing
    # Only on main, and only once every job feeding ci-green has passed: what reaches the
    # testers has been through exactly the same gate as a merge. A red CI leaves this skipped.
    # workflow_dispatch: a merge made by the Dependency updates workflow sets off no push run, so
    # it starts one on main instead, and that build ships like any other merge.
    needs: ci-green
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds the release secrets, so they exist on no other job in this workflow. Add required
    # reviewers to this environment in repo settings if a build should ever wait for a human.
    environment: play-internal
    # pull-requests: read is for finding the PR this commit merged, which names the version.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The run number is unique and only ever increases for this workflow, so it satisfies Play's
      # "strictly greater than anything already uploaded" rule with no state to keep. If Play
      # already holds a higher versionCode, set the repository variable VERSION_CODE_OFFSET to lift
      # the run number past it — only ever raise it. Workflow expressions have no arithmetic, so
      # the sum is done here rather than in an `env:` block.
      - name: Work out the versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
          OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: echo "VERSION_CODE=$(( RUN_NUMBER + ${OFFSET:-0} ))" >> "$GITHUB_ENV"

      # The versionName is appVersionBase (gradle.properties) plus the number of the PR this commit
      # merged, e.g. 1.0.62: the same string the "App version" workflow wrote into that PR's
      # description before it merged, and what the app shows when its route badge is tapped. A
      # push to main that came from no PR keeps the plain base, with a warning.
      - name: Work out the versionName
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -n 's/^appVersionBase=//p' gradle.properties)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')
          if [ -n "$pr" ]; then
            echo "RELEASE_PR=$pr" >> "$GITHUB_ENV"
            echo "VERSION_NAME=$base.$pr" >> "$GITHUB_ENV"
          else
            echo "::warning::No merged pull request for $GITHUB_SHA, so this release is plain $base"
            echo "VERSION_NAME=$base" >> "$GITHUB_ENV"
          fi

      # Every one of these is load-bearing, and the two failure modes are silent: without the
      # keystore the release build would fall back to the debug key, and without the Firebase
      # config the shipped app cannot register for push. Stop before spending a build on either.
      - name: Check the release secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON GOOGLE_SERVICES_JSON; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the play-internal environment:$missing — see docs/release-to-play.md"
            exit 1
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      # The upload key itself: the app's identity on Play, and unrecoverable if lost. It is
      # gitignored and the runner is torn down after the job, but keep it out of any uploaded
      # artifact all the same. The passwords stay in the environment rather than in a file.
      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p androidApp/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > androidApp/keystore/homesafe-release.jks

      # A run that is tried again can get here after main has moved on: nothing cancels it then
      # (see `concurrency` at the top), and it may be queued behind the newer commit's run. That
      # commit's run is the one that ships, with the higher versionCode; this one would put an
      # older build on the track, or be refused by Play for a versionCode below the newest. So it
      # builds and uploads nothing, and ends green. Asked here, in the job itself, so that a rerun
      # of this job alone asks again.
      - name: Is this still main's newest commit?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "STILL_NEWEST=true" >> "$GITHUB_ENV"
          else
            echo "::notice::main has moved on from ${GITHUB_SHA:0:7} to ${tip:0:7}, whose own run publishes; nothing is built or uploaded here."
            echo "STILL_NEWEST=false" >> "$GITHUB_ENV"
          fi

      # androidApp/build.gradle.kts reads these four when there is no keystore.properties, and
      # -PrequireReleaseSigning=true turns a missing one into a failed build instead of a bundle
      # signed with the debug key.
      - name: ./gradlew :androidApp:bundleRelease
        if: env.STILL_NEWEST == 'true'
        env:
          ANDROID_KEYSTORE_FILE: androidApp/keystore/homesafe-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            ${RELEASE_PR:+-PreleasePr="$RELEASE_PR"} \
            -PrequireReleaseSigning=true \
            --stacktrace

      # Play shows this to internal testers as the release notes for the build: the commit subject,
      # then the version the app will show when its route badge is tapped.
      - name: Release notes from the commit subject
        if: env.STILL_NEWEST == 'true'
        run: |
          mkdir -p build/whatsnew
          {
            git log -1 --pretty=%s
            echo
            echo "$VERSION_NAME ($VERSION_CODE) · ${GITHUB_SHA:0:7}"
          } | head -c 500 > build/whatsnew/whatsnew-en-US
          cat build/whatsnew/whatsnew-en-US

      # Play's API now and then answers "The service is currently unavailable" within a second, and
      # that alone has kept a green build off the phone. So a failed upload is made once more a
      # minute later; an upload Play refuses for a reason of its own is refused again, and that
      # second answer is the one that fails the job. The two steps take the same inputs: change
      # them together.
      - name: Upload to the internal track
        id: upload
        if: env.STILL_NEWEST == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.meticulouscreations.homesafe
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          # Lets Play deobfuscate R8-minified stack traces from testers' crash reports.
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: build/whatsnew
      - name: Wait a minute before uploading again
        if: steps.upload.outcome == 'failure'
        run: sleep 60
      - name: Upload to the internal track, second try
        if: steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.meticulouscreations.homesafe
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: build/whatsnew

      # Keeps the exact artefact and its mapping file for the versionCode that went out — the
      # mapping is the only way to read a stack trace from that build once R8 has renamed it.
      - uses: actions/upload-artifact@v7
        if: always() && env.STILL_NEWEST == 'true'
        with:
          name: release-bundle-${{ env.VERSION_CODE }}
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 90
