name: CI

# Shape of the pipeline: every Gradle task set that can run on its own gets its own runner
# (the `gradle` matrix below), the emulator and iOS jobs run beside them, and ci-green fans
# everything back into the one required status check.
#
# Nothing here builds the production web bundle. Running webpack + terser over the
# Compose-for-JS output took ~18 of the old ~25 minutes and nothing consumed the result;
# the web targets are linked instead, which still catches a missing actual or dependency.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            # --continue: still run the Android host tests when the JVM ones fail, so one
            # run reports everything that is broken.
            tasks: :shared:jvmTest :shared:testAndroidHostTest --continue
            artifact: unit-test-reports
            reports: shared/build/reports/tests/**
          - name: Android build, lint and stability gate
            # All three share :shared:compileAndroidMain, so they belong on one runner.
            tasks: :androidApp:assembleDebug :androidApp:lintDebug :shared:stabilityCheck
            artifact: android-reports
            reports: |
              androidApp/build/reports/**
              shared/build/reports/**
          - name: Kotlin style
            # ktlint + compose-rules. Needs no compilation, so it is the cheapest leg here and
            # the one that fails fastest on a PR that skipped `./gradlew :shared:ktlintFormat`.
            tasks: :shared:ktlintCheck
            artifact: ktlint-reports
            reports: shared/build/reports/ktlint/**
          - name: Desktop and web
            # Links the JS and Wasm executables without bundling them; see the note at the top.
            tasks: :desktopApp:build :webApp:compileDevelopmentExecutableKotlinJs :webApp:compileDevelopmentExecutableKotlinWasmJs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Same-repo runs get the real Firebase config; fork PRs get no secrets and build
      # without it (androidApp/build.gradle.kts applies the plugin only when it exists).
      - name: Write google-services.json
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
            echo "Firebase config written."
          else
            echo "GOOGLE_SERVICES_JSON secret not set; building without Firebase."
          fi

      # The Compose UI tests in jvmTest rasterise through skiko, which links libGL and fontconfig.
      - name: Install skiko native dependencies
        if: contains(matrix.tasks, 'jvmTest')
        run: sudo apt-get update && sudo apt-get install -y libgl1 libfontconfig1

      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.artifact }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.reports }}
          retention-days: 7

  android-ui:
    name: Android UI tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # KVM is what makes the x86_64 emulator usable on a hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted AVD is cached as a snapshot, so later runs resume it instead of cold-booting.
      # Caches made on main are visible to every branch; a miss only happens the first time
      # the API level changes (or after the cache is evicted), and then costs one extra boot.
      - name: AVD snapshot cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Runs the whole commonTest suite on-device, plus src/uiTest/kotlin — so the Compose
      # UI tests execute on a real Android runtime here, on the iOS simulator in the ios job,
      # and on the JVM in the unit tests job. Verified locally: 182 tests, 5 of them HomeFeedUiTest.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-reports
          path: shared/build/reports/**
          retention-days: 7

  ios:
    name: iOS tests and build
    # Branches in this repo run on the self-hosted Mac. A fork's pull request must never
    # execute there, so it goes to a GitHub-hosted macOS runner instead (it needs no secrets).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || fromJSON('["self-hosted", "macOS"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The Mac has its own JDK and a persistent ~/.konan; only the hosted runner needs these.
      - uses: actions/setup-java@v6
        if: runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Kotlin/Native
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: iOS simulator unit tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

  ci-green:
    name: ci-green
    # The single required status check. Jobs can be added or renamed without touching
    # branch protection, as long as they are listed here.
    if: always()
    needs: [gradle, android-ui, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Show job results
        run: echo '${{ toJSON(needs) }}'
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  publish-internal:
    name: Publish to Play internal testing
    # Only on main, and only once every job feeding ci-green has passed: what reaches the
    # testers has been through exactly the same gate as a merge. A red CI leaves this skipped.
    needs: ci-green
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds the release secrets, so they exist on no other job in this workflow. Add required
    # reviewers to this environment in repo settings if a build should ever wait for a human.
    environment: play-internal
    env:
      # Unique and monotonic for this workflow, so it satisfies Play's "strictly greater than
      # anything already uploaded" rule without any state to keep. If the app on Play already has
      # a higher versionCode, set the repository variable VERSION_CODE_OFFSET to lift the run
      # number past it — never lower it, and never reset it.
      VERSION_CODE: ${{ github.run_number + (vars.VERSION_CODE_OFFSET && fromJSON(vars.VERSION_CODE_OFFSET) || 0) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Every one of these is load-bearing, and the two failure modes are silent: without the
      # keystore the release build would fall back to the debug key, and without the Firebase
      # config the shipped app cannot register for push. Stop before spending a build on either.
      - name: Check the release secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON GOOGLE_SERVICES_JSON; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the play-internal environment:$missing — see docs/release-to-play.md"
            exit 1
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      # The upload key itself: the app's identity on Play, and unrecoverable if lost. It is
      # gitignored and the runner is torn down after the job, but keep it out of any uploaded
      # artifact all the same. The passwords stay in the environment rather than in a file.
      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p androidApp/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > androidApp/keystore/homesafe-release.jks

      # androidApp/build.gradle.kts reads these four when there is no keystore.properties, and
      # -PrequireReleaseSigning=true turns a missing one into a failed build instead of a bundle
      # signed with the debug key.
      - name: ./gradlew :androidApp:bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: androidApp/keystore/homesafe-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PrequireReleaseSigning=true \
            --stacktrace

      # Play shows this to internal testers as the release notes for the build.
      - name: Release notes from the commit subject
        run: |
          mkdir -p build/whatsnew
          {
            git log -1 --pretty=%s
            echo
            echo "${GITHUB_SHA:0:7}"
          } | head -c 500 > build/whatsnew/whatsnew-en-US
          cat build/whatsnew/whatsnew-en-US

      - name: Upload to the internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.meticulouscreations.homesafe
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          # Lets Play deobfuscate R8-minified stack traces from testers' crash reports.
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: build/whatsnew

      # Keeps the exact artefact and its mapping file for the versionCode that went out — the
      # mapping is the only way to read a stack trace from that build once R8 has renamed it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-bundle-${{ env.VERSION_CODE }}
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 90
