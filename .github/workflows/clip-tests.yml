# The clip journeys (app/src/androidDeviceTest's ClipJourneyTest) on an API 34 emulator: cut a clip
# in the editor, save it, find it in Downloads and play it; play a detection's clip in Moments and
# download that. The fake Frigate serves real H.264 for them.
#
# On an emulator, and not only with the device tests on apksim (apksim.yml), because apksim can't
# run them yet: its test runs list no video decoder (and its media store refuses a file in
# Downloads), so there the four journeys skip themselves and say why. Until apksim can, this
# is where a pull request that touches clips, the player or the fake's video has them checked; the
# nightly emulator run (device-tests-nightly.yml) has them with everything else.
#
# Not part of ci-green, like the Android CLI journeys: it runs only for the paths below, or by hand.
name: Clip journeys on an emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/src/androidDeviceTest/**
      - app/src/integrationTest/**
      - fake-frigate/**
      - shared/src/**/*Clip*
      - shared/src/**/MomentsScreen.kt
      - shared/src/**/MomentsViewModel.kt
      - shared/src/**/MomentsRepositoryImpl.kt
      - shared/src/**/CameraStreamPlayer*.kt
      - shared/src/**/RecordingsRepositoryImpl.kt
      - shared/src/**/FrigateSession.kt
      - shared/src/androidMain/**/ui/components/**
      - scripts/run-instrumented-tests.sh
      - .github/workflows/clip-tests.yml

permissions:
  contents: read

concurrency:
  group: clip-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clips:
    name: Clip journeys (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: 34
      CLIP_JOURNEYS: com.meticulouscreations.homesafe.integration.ClipJourneyTest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # KVM is what makes the x86_64 emulator usable on a hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same booted AVD snapshot the nightly device tests and CI's startup-perf job keep.
      - name: AVD snapshot cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create AVD and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Clip journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/run-instrumented-tests.sh 30 -- :app:connectedAndroidDeviceTest -Pandroid.testInstrumentationRunnerArguments.class=${{ env.CLIP_JOURNEYS }} --stacktrace

      - name: Print instrumented test failures
        if: failure()
        run: python3 scripts/print-test-failures.py app/build/outputs/androidTest-results

      # The journeys skip themselves where they can't run (apksim). An emulator can run every one:
      # a skip here would be a green job that checked nothing.
      - name: Every clip journey ran
        run: |
          python3 - <<'EOF'
          import glob, sys
          import xml.etree.ElementTree as ET
          cases = [c for p in glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True)
                   for c in ET.parse(p).iter("testcase")]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"{len(cases)} clip journeys, {len(skipped)} skipped")
          if not cases or skipped:
              sys.exit(f"::error::Clip journeys that did not run on the emulator: {skipped or 'all of them (no results)'}")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clip-journey-reports
          path: |
            app/build/reports/**
            app/build/outputs/androidTest-results/**
          retention-days: 7
