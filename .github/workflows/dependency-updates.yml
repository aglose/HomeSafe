name: Dependency updates

# Merges the weekly Dependabot pull requests (.github/dependabot.yml) without anyone having to,
# as long as an update is only version numbers. See docs/dependency-updates.md.
#
# It runs each time CI finishes on a Dependabot branch:
#
# - CI green, and scripts/ci/dependency_gate.py finds nothing in the diff but version numbers:
#   an agent reads the release notes (when there is a key for one), and the pull request is
#   squash-merged. CI is then started on main, so the merge is built and published like any other.
# - CI green, but the diff has more in it than version numbers (someone, or the repair job, changed
#   code): left open and labelled. That one is for a person to read.
# - CI red: an agent works out which update broke the build and holds that one back, so the rest
#   still merge; with no key, the failed jobs are run once more in case it was a flake. What
#   can't be sorted out is left open and labelled.
#
# Why workflow_run, and not a job in ci.yml or GitHub's own auto-merge:
#
# - A workflow_run workflow is always the copy on main, with a token of its own. A run started by
#   a Dependabot pull request gets a read-only token and no secrets, and would be running whatever
#   gate script the branch carries.
# - The decision is made once, at merge time, about the exact commit CI just passed. Auto-merge is
#   switched on earlier and stays on whatever is pushed afterwards.
#
# The jobs that run an agent (review, repair) hold only a read-only token, and the agent has no
# shell: it reads and edits files, and nothing from the pull request is run beside its key. The
# repair job hands its change over as a patch, and a separate job with no agent in it commits that
# to the branch. The agent cannot merge anything, and what it changed goes back through CI and the
# gate like the rest.
#
# Needs no setup to merge updates that pass. The review and the repair need one repository secret:
# ANTHROPIC_API_KEY (the one the Android CLI journeys use) or CLAUDE_CODE_OAUTH_TOKEN.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # To look at one pull request again by hand, e.g. after rerunning CI on it.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the Dependabot pull request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-updates-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  LABEL: 'dependencies: needs a human'
  # After this many commits on the branch that aren't Dependabot's, the repair job stops trying.
  MAX_REPAIRS: 2

jobs:
  triage:
    name: Find the pull request and read its diff
    # Only CI runs on this repository's own Dependabot branches. A fork can name a branch anything,
    # so the repository is checked here and the pull request's author below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      go: ${{ steps.pr.outputs.go }}
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      branch: ${{ steps.pr.outputs.branch }}
      conclusion: ${{ steps.pr.outputs.conclusion }}
      run-id: ${{ steps.pr.outputs.run-id }}
      run-attempt: ${{ steps.pr.outputs.run-attempt }}
      base: ${{ steps.gate.outputs.base }}
      simple: ${{ steps.gate.outputs.simple }}
      other-commits: ${{ steps.gate.outputs.other-commits }}
    steps:
      # main's scripts, never the pull request's: the gate must not be something a branch can edit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          stop() {
            echo "::notice::$1"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -n "$INPUT_PR" ]; then
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
          else
            pull=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$RUN_BRANCH" --jq '.[0] // empty')
          fi
          [ -n "$pull" ] || stop "No open pull request for $RUN_BRANCH."
          field() { jq -r "$1" <<< "$pull"; }
          number=$(field .number)
          sha=$(field .head.sha)
          [ "$(field .state)" = "open" ] || stop "#$number is not open."
          [ "$(field .user.login)" = "dependabot[bot]" ] || stop "#$number was not opened by Dependabot."
          [ "$(field .head.repo.full_name)" = "$GITHUB_REPOSITORY" ] || stop "#$number comes from a fork."
          [ "$(field .base.ref)" = "$DEFAULT_BRANCH" ] || stop "#$number does not target $DEFAULT_BRANCH."

          if [ -n "$INPUT_PR" ]; then
            # Run by hand: go by the last CI run that finished on the pull request's head.
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$sha" -f status=completed \
              --jq '[.workflow_runs[] | select(.event == "pull_request" or .event == "workflow_dispatch")] | sort_by(.updated_at) | last // empty')
            [ -n "$run" ] || stop "CI has not finished on #$number's head ($sha) yet."
            RUN_ID=$(jq -r .id <<< "$run")
            RUN_ATTEMPT=$(jq -r .run_attempt <<< "$run")
            RUN_CONCLUSION=$(jq -r .conclusion <<< "$run")
          elif [ "$RUN_SHA" != "$sha" ]; then
            stop "CI ran on $RUN_SHA, but #$number has moved on to $sha."
          fi

          case "$RUN_CONCLUSION" in
            success) conclusion=success ;;
            failure | timed_out) conclusion=failure ;;
            # Cancelled is what a run looks like when Dependabot pushed again under it.
            *) stop "CI ended as '$RUN_CONCLUSION' on #$number; nothing to do." ;;
          esac

          echo "#$number at $sha: CI run $RUN_ID (attempt $RUN_ATTEMPT) ended in $conclusion"
          {
            echo "go=true"
            echo "pr=$number"
            echo "sha=$sha"
            echo "branch=$(field .head.ref)"
            echo "conclusion=$conclusion"
            echo "run-id=$RUN_ID"
            echo "run-attempt=$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Is it only version numbers?
        id: gate
        if: steps.pr.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git fetch --quiet origin "refs/pull/$PR/head"
          base=$(git merge-base "origin/$DEFAULT_BRANCH" "$SHA")
          out=build/dependency-updates
          mkdir -p "$out"

          status=0
          python3 scripts/ci/dependency_gate.py --base "$base" --head "$SHA" \
            --json "$out/gate.json" --markdown "$out/gate.md" || status=$?
          # 0 is "only version numbers" and 1 is "more than that"; anything else is the gate failing.
          [ "$status" -le 1 ] || exit "$status"
          simple=$(jq -r .simple "$out/gate.json")

          # The gate goes by the author name git records, which anyone who can push could type.
          # GitHub knows who really made a commit. Every one the gate took for Dependabot's has to
          # be Dependabot's and signed, not only the last: an earlier one with the name typed in
          # could otherwise leave a version of its own choosing in the diff.
          if [ "$simple" = "true" ]; then
            for commit in $(jq -r '.dependabot_commits[]' "$out/gate.json"); do
              who=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '"\(.author.login) \(.commit.verification.verified)"')
              if [ "$who" != "dependabot[bot] true" ]; then
                simple=false
                printf '\nNot merged automatically: commit %s is not a signed commit by Dependabot (%s).\n' "$commit" "$who" >> "$out/gate.md"
              fi
            done
            if [ "$simple" != "true" ]; then cat "$out/gate.md"; fi
          fi

          git diff "$base" "$SHA" > "$out/changes.diff"
          {
            echo "base=$base"
            echo "simple=$simple"
            echo "other-commits=$(jq -r .other_commits "$out/gate.json")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.pr.outputs.go == 'true'
        with:
          name: dependency-gate
          path: build/dependency-updates/
          retention-days: 14

  # Green and only version numbers: before it merges, have the release notes read.
  review:
    name: Read the release notes
    needs: triage
    if: needs.triage.outputs.go == 'true' && needs.triage.outputs.conclusion == 'success' && needs.triage.outputs.simple == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ran: ${{ steps.key.outputs.present }}
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - name: Check for an agent key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set, so nothing reads the release notes; the update merges on a green CI alone."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # main, so the agent can look up what the app uses. The update itself is in changes.diff.
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: steps.key.outputs.present == 'true'
        with:
          name: dependency-gate
          path: build/dependency-review

      - name: Fetch the pull request's description
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.triage.outputs.pr }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"# " + .title + "\n\n" + (.body // "")' \
            > build/dependency-review/pull-request.md

      # A step of its own, so the package's install scripts run with no secret in the environment.
      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --global @anthropic-ai/claude-code

      # Read-only tools, and no shell: the agent can look, and answer, and nothing else.
      - name: Review
        id: review
        if: steps.key.outputs.present == 'true'
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # An empty variable would be taken as a (wrong) credential, so only the one that is set.
          if [ -n "$API_KEY" ]; then export ANTHROPIC_API_KEY="$API_KEY"; fi
          if [ -n "$OAUTH_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"; fi
          unset API_KEY OAUTH_TOKEN

          out=build/dependency-review
          status=0
          timeout 20m claude -p "$(cat scripts/ci/dependency-review-prompt.md)" \
            --allowedTools "Read" "Glob" "Grep" \
            > "$out/answer.md" 2> "$out/review.log" || status=$?
          cat "$out/answer.md"

          # The answer has to open with its verdict and give exactly one. Anything else (the agent
          # failed, wrote something first, or gave two, as an answer steered by what it read
          # might) is not a yes.
          verdict=$(awk 'NF { print; exit }' "$out/answer.md" \
            | sed -n -E 's/^[[:space:]]*VERDICT:[[:space:]]*(merge|hold)[[:space:]]*$/\1/p')
          if [ "$(grep -c -i 'VERDICT:' "$out/answer.md")" -ne 1 ]; then verdict=; fi
          if [ "$status" -ne 0 ] || [ -z "$verdict" ]; then
            echo "::warning::The review did not finish (exit $status); see the dependency-review artifact."
            tail -n 20 "$out/review.log" || true
            verdict=unfinished
          fi
          grep -v -i 'VERDICT:' "$out/answer.md" | sed '/[^[:space:]]/,$!d' > "$out/review.md" || true
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: dependency-review
          path: |
            build/dependency-review/review.md
            build/dependency-review/answer.md
            build/dependency-review/review.log
          retention-days: 14

  merge:
    name: Merge it, or leave it for someone
    needs: [triage, review]
    # always(): the review is skipped when the gate already said no, and this still has to say so.
    if: always() && needs.triage.outputs.go == 'true' && needs.triage.outputs.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # merge
      pull-requests: write # comment and label
      issues: write # the note about updates that were held back
      actions: write # start CI on main
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.triage.outputs.pr }}
      SHA: ${{ needs.triage.outputs.sha }}
      BRANCH: ${{ needs.triage.outputs.branch }}
      SIMPLE: ${{ needs.triage.outputs.simple }}
      REVIEWED: ${{ needs.review.outputs.ran }}
      VERDICT: ${{ needs.review.outputs.verdict }}
      # Optional. Everything here works with GITHUB_TOKEN as far as GitHub documents it; this is
      # the way out if it ever refuses a merge (a token that may not touch workflow files merging
      # an update to the actions, say). A fine-grained token for this repository with Contents,
      # Pull requests and Workflows: read and write.
      MERGE_TOKEN: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dependency-gate
          path: gate
      # Missing when the review job failed before it wrote anything; that case is handled below.
      - uses: actions/download-artifact@v8
        if: needs.review.outputs.ran == 'true'
        continue-on-error: true
        with:
          name: dependency-review
          path: review

      - name: Merge, or say why not
        run: |
          api() { gh api --silent "$@"; }
          comment() { api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$1"; }
          ensure_label() {
            # 422 when the label is already there.
            api --method POST "repos/$GITHUB_REPOSITORY/labels" -f name="$LABEL" -f color=D93F0B \
              -f description="The dependency automation could not finish this by itself" 2> /dev/null || true
          }
          needs_a_human() {
            ensure_label
            api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$LABEL"
          }
          review_notes() {
            if [ -s review/review.md ]; then
              printf '\n**Release notes review** (by an agent; it reads what upstream published, it does not run anything)\n\n'
              cat review/review.md
            fi
          }

          if [ "$SIMPLE" != "true" ]; then
            {
              echo "CI is green, but this is no longer only a dependency update, so it is yours to review and merge."
              echo
              cat gate/gate.md
            } > comment.md
            comment comment.md
            needs_a_human
            exit 0
          fi

          if [ "$REVIEWED" = "true" ] && [ "$VERDICT" != "merge" ]; then
            {
              if [ "$VERDICT" = "hold" ]; then
                echo "CI is green and this is only version numbers, but the review of the release notes found something for you to look at first. Merge it yourself once you have."
              else
                echo "CI is green and this is only version numbers, but the review of the release notes did not finish, so it was not merged. Run the **Dependency updates** workflow with this pull request's number to try again, or merge it yourself."
              fi
              review_notes
            } > comment.md
            comment comment.md
            needs_a_human
            exit 0
          fi

          # --match-head-commit: merge exactly the commit CI passed and the gate read, or nothing.
          # MERGE_TOKEN is the optional DEPENDENCY_UPDATES_TOKEN secret; see the env block above.
          if ! error=$(GH_TOKEN="${MERGE_TOKEN:-$GH_TOKEN}" gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA" 2>&1); then
            {
              echo "CI is green and this is only version numbers, but merging it failed:"
              echo
              echo '```'
              echo "$error"
              echo '```'
            } > comment.md
            comment comment.md
            needs_a_human
            exit 1
          fi

          {
            echo "Merged automatically: CI is green and every changed line is a version number."
            echo
            sed '1d' gate/gate.md
            review_notes
          } > comment.md
          comment comment.md
          api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$(jq -rn --arg label "$LABEL" '$label | @uri')" 2> /dev/null || true
          api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" 2> /dev/null || true

          # A merge made with GITHUB_TOKEN sets off no push run, so main's CI (and with it the build
          # for Play internal testing) is started here instead. One made with the owner's token
          # set off a push run like any other merge.
          if [ -z "$MERGE_TOKEN" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          fi

          # Updates the repair job took out to get this green are otherwise easy to never hear of.
          if [ "$(jq '.held_back | length' gate/gate.json)" -gt 0 ]; then
            {
              echo "#$PR was merged without these updates, because CI failed with them in:"
              echo
              jq -r '.held_back[] | "- " + .' gate/gate.json
              echo
              echo "What failed, and what taking each one would need, is in the comments on #$PR. Dependabot proposes them again every week; each time one still breaks the build it is held back again and noted here."
            } > issue.md
            issue=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels="$LABEL" \
              --jq '[.[] | select(.pull_request == null)][0].number // empty')
            if [ -n "$issue" ]; then
              api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -F body=@issue.md
            else
              ensure_label
              api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="Dependency updates that were held back" \
                -F body=@issue.md -f "labels[]=$LABEL"
            fi
          fi

  # Red: find the update that broke the build, and hand back a patch that takes it out.
  repair:
    name: Work out what broke
    needs: triage
    if: needs.triage.outputs.go == 'true' && needs.triage.outputs.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read-only, and nothing from the pull request is run here: the agent has no shell, so it reads
    # the failed log and edits files, and CI is what tries the result. Code from a version nobody
    # has vetted never runs in a process that holds the agent's key.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      ran: ${{ steps.key.outputs.present }}
    env:
      PR: ${{ needs.triage.outputs.pr }}
      SHA: ${{ needs.triage.outputs.sha }}
      BASE: ${{ needs.triage.outputs.base }}
      RUN_ID: ${{ needs.triage.outputs.run-id }}
      OTHER_COMMITS: ${{ needs.triage.outputs.other-commits }}
    steps:
      - name: Check for an agent key, and that there are tries left
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set, so there is no agent to repair this."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ "$OTHER_COMMITS" -ge "$MAX_REPAIRS" ]; then
            echo "::notice::The branch already has $OTHER_COMMITS repair commits; not trying again."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Before anything of the pull request's is on the runner, away from its directory (npm reads
      # an .npmrc from where it runs), and with no secret in the environment.
      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --global @anthropic-ai/claude-code

      # The prompt comes from main; the code to repair is the pull request's.
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ needs.triage.outputs.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0

      - name: Collect the failure
        if: steps.key.outputs.present == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/dependency-repair
          mkdir -p "$out"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | "\(.conclusion)\t\(.name)"' > "$out/jobs.txt"
          cat "$out/jobs.txt"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$out/failed.log" || true
          wc -l "$out/failed.log"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"# " + .title + "\n\n" + (.body // "")' > "$out/pull-request.md"
          git diff "$BASE" "$SHA" > "$out/changes.diff"

      # File tools only, and no GitHub token in this step. --setting-sources user: the branch's own
      # .claude settings are not loaded, so it cannot bring hooks for the agent to run.
      - name: Repair
        if: steps.key.outputs.present == 'true'
        working-directory: pr
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY" ]; then export ANTHROPIC_API_KEY="$API_KEY"; fi
          if [ -n "$OAUTH_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"; fi
          unset API_KEY OAUTH_TOKEN

          status=0
          timeout 30m claude -p "$(cat ../trusted/scripts/ci/dependency-repair-prompt.md)" \
            --setting-sources user \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
            > build/dependency-repair/agent.log 2>&1 || status=$?
          tail -n 40 build/dependency-repair/agent.log
          echo "The agent exited with $status."

      # Whatever the agent left in the working tree, as a patch against the pull request's head.
      # build/ is ignored, so its notes stay out of it.
      - name: Package the result
        if: always() && steps.key.outputs.present == 'true'
        working-directory: pr
        run: |
          out="$RUNNER_TEMP/dependency-repair"
          mkdir -p "$out"
          cp build/dependency-repair/result.json build/dependency-repair/agent.log "$out/" 2> /dev/null || true
          git add --all
          git diff --cached --binary "$SHA" > "$out/repair.patch"
          git diff --cached --stat "$SHA"

      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: dependency-repair
          path: ${{ runner.temp }}/dependency-repair/
          retention-days: 14

  after-failure:
    name: Apply the repair, rerun, or ask for help
    needs: [triage, repair]
    # always(): this still has to answer when the repair job itself failed.
    if: always() && needs.triage.outputs.go == 'true' && needs.triage.outputs.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No agent here, and nothing from the pull request is run: the patch is applied as data.
    permissions:
      contents: write # push the repair to the Dependabot branch
      pull-requests: write # comment and label
      actions: write # rerun CI, or start it on the branch
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.triage.outputs.pr }}
      SHA: ${{ needs.triage.outputs.sha }}
      BASE: ${{ needs.triage.outputs.base }}
      BRANCH: ${{ needs.triage.outputs.branch }}
      RUN_ID: ${{ needs.triage.outputs.run-id }}
      RUN_ATTEMPT: ${{ needs.triage.outputs.run-attempt }}
      REPAIRED: ${{ needs.repair.outputs.ran }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.triage.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.triage.outputs.branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: needs.repair.outputs.ran == 'true'
        continue-on-error: true
        with:
          name: dependency-repair
          path: ${{ runner.temp }}/repair

      - name: Apply the repair, rerun, or ask for help
        env:
          REPAIR: ${{ runner.temp }}/repair
        run: |
          api() { gh api --silent "$@"; }
          comment() { api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$1"; }
          needs_a_human() {
            {
              echo "$1"
              agent_notes
              echo
              echo "[The failed CI run]($RUN_URL)"
            } > "$RUNNER_TEMP/comment.md"
            comment "$RUNNER_TEMP/comment.md"
            # 422 when the label is already there.
            api --method POST "repos/$GITHUB_REPOSITORY/labels" -f name="$LABEL" -f color=D93F0B \
              -f description="The dependency automation could not finish this by itself" 2> /dev/null || true
            api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$LABEL"
            exit 0
          }
          # The agent's own account of what it found. It read CI logs and release notes to write it.
          agent_notes() {
            [ -f "$REPAIR/result.json" ] || return 0
            printf '\n**What the repair job found** (written by an agent from the CI log)\n\n'
            jq -r '.summary // "" | tostring | .[0:20000]' "$REPAIR/result.json" 2> /dev/null || true
            jq -r '(.held_back // [])[] | "- Held back **\(.dependency)** \(.from) → \(.to): \(.reason)"' "$REPAIR/result.json" 2> /dev/null || true
          }
          rerun() {
            gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
            echo "::notice::Rerunning the failed jobs of CI run $RUN_ID."
            exit 0
          }

          action=none
          if [ "$REPAIRED" = "true" ]; then
            action=$(jq -r '.action // "none" | tostring' "$REPAIR/result.json" 2> /dev/null || echo none)
          fi
          echo "The repair job's answer: $action"

          case "$action" in
            patch)
              if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
                echo "::notice::$BRANCH moved while the repair was being worked out; leaving it to the next CI run."
                exit 0
              fi
              if [ ! -s "$REPAIR/repair.patch" ]; then
                needs_a_human "CI failed, and the repair job said it had a fix but changed nothing."
              fi
              if ! git apply --index "$REPAIR/repair.patch"; then
                git reset --quiet --hard "$SHA"
                needs_a_human "CI failed, and the repair job's fix does not apply to the branch."
              fi
              # Workflows, the agent's own settings and the Gradle wrapper are not the repair job's
              # to change: CI is about to be started on this branch, and would run them. Checked on
              # what was staged rather than on the patch's summary, which abbreviates a rename;
              # --no-renames lists a renamed file under both its old path and its new one.
              if git diff --cached --name-only --no-renames -z "$SHA" \
                | grep -z -E '^(\.github/|\.claude/|gradle/wrapper/|gradlew$|gradlew\.bat$)' | tr '\0' '\n'; then
                git reset --quiet --hard "$SHA"
                needs_a_human "CI failed, and the repair job's fix touches the files above, which it may not change."
              fi
              if git diff --cached --quiet "$BASE"; then
                git reset --quiet --hard "$SHA"
                needs_a_human "CI failed, and the only way the repair job found to get it green was to hold back every update in this pull request."
              fi
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "Dependency updates: repair after a failed CI run"
              git push --quiet origin "HEAD:refs/heads/$BRANCH"
              {
                echo "CI failed, so the repair job changed the branch (commit $(git rev-parse HEAD)) and CI is running again on it. If what is left is still only version numbers and CI passes, it merges; if code had to change, it waits for you."
                agent_notes
                echo
                echo "[The failed CI run]($RUN_URL)"
              } > "$RUNNER_TEMP/comment.md"
              comment "$RUNNER_TEMP/comment.md"
              # The push was made with GITHUB_TOKEN, which sets off no run that would start unasked.
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
              ;;
            rerun)
              if [ "$RUN_ATTEMPT" -lt 3 ]; then rerun; fi
              needs_a_human "CI has failed $RUN_ATTEMPT times on this commit. The repair job put it down to something other than the update, but rerunning has not helped."
              ;;
            give-up)
              needs_a_human "CI failed, and the repair job could not get it green."
              ;;
            *)
              # No agent (no key, or it has used its tries), or it left no answer. Once more in case
              # it was a flake; after that it is someone's to look at.
              if [ "$RUN_ATTEMPT" -lt 2 ]; then rerun; fi
              needs_a_human "CI failed twice on this commit, and nothing here could repair it."
              ;;
          esac
