name: Android CLI journeys

# The natural-language journeys in androidApp/src/journeysTest, run by an agent through the Android
# CLI (see scripts/run-android-cli-journeys.sh and docs/testing.md), on apksim
# (https://github.com/aglose/apksim) in its Linux image: one instance per journey, no emulator.
# The nightly run (android-cli-journeys-nightly.yml) calls this twice, on apksim and on an API 34
# emulator, and compares the two.
#
# Not part of ci-green: an agent evaluates each step from what is on screen, which costs model
# tokens and is not deterministic, so a pull request runs it only when it changes the journeys or
# how they run, and anything else waits for the nightly run or a run by hand.
# The deterministic suites (Compose UI tests, integration journeys, MainActivity E2E) are in ci.yml.
# Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret (Claude Code on a Claude subscription, from
# `claude setup-token`; no API key is used); without it the job says so and stops.

on:
  workflow_call:
    inputs:
      device:
        description: apksim or emulator
        type: string
        default: apksim
  workflow_dispatch:
    inputs:
      device:
        description: Where the journeys run
        type: choice
        options: [apksim, emulator]
        default: apksim
  pull_request:
    paths:
      - androidApp/src/journeysTest/**
      - scripts/run-android-cli-journeys.sh
      - scripts/ci/compare-journeys.py
      - .github/workflows/android-cli-journeys.yml
      - .github/workflows/android-cli-journeys-nightly.yml

permissions:
  contents: read

concurrency:
  group: android-cli-journeys-${{ github.ref }}-${{ inputs.device || 'apksim' }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Android CLI journeys (${{ inputs.device || 'apksim' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVICE: ${{ inputs.device || 'apksim' }}
      # Moved with apksim.yml's: a new release can change how apps translate.
      APKSIM_IMAGE: ghcr.io/aglose/apksim:0.8.0
      API_LEVEL: 34
    steps:
      - name: Check for an agent token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Android CLI journeys."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      # Pulled beside the build, so it is ready when the APK is.
      - name: Pull apksim's image
        if: steps.key.outputs.present == 'true' && env.DEVICE == 'apksim'
        run: docker pull --quiet "$APKSIM_IMAGE" > pull.log 2>&1 &
      - uses: actions/setup-java@v6
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.key.outputs.present == 'true'
        with:
          cache-read-only: true

      - name: Build the debug app and the fake Frigate
        if: steps.key.outputs.present == 'true'
        run: ./gradlew :androidApp:assembleDebug :fake-frigate:installDist --stacktrace

      # On the runner. An emulator reaches it at 10.0.2.2, apksim (on the runner's network) at
      # localhost; the runner sets FRIGATE_URL to match, and the journeys' address is rewritten to it.
      - name: Start the fake Frigate
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p build/journeys
          if [ "$DEVICE" = apksim ]; then host='::'; advertise=localhost; else host=0.0.0.0; advertise=10.0.2.2; fi
          nohup fake-frigate/build/install/fake-frigate/bin/fake-frigate --port 8971 --host "$host" --advertise "$advertise" \
            > build/journeys/fake-frigate.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8971/api/version && exit 0
            sleep 1
          done
          echo "::error::The fake Frigate did not start"; cat build/journeys/fake-frigate.log; exit 1

      - name: Install the Android CLI and Claude Code
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install_root.sh | sudo bash
          printf -- '--sdk=%s\n--no-metrics\n' "$ANDROID_HOME" > ~/.androidrc
          android --version
          npm install -g @anthropic-ai/claude-code
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # Each journey gets a container of its own, which shares the runner's network: adb reaches the
      # instance at localhost:15037, and the app reaches the fake Frigate at localhost:8971. The
      # runner has no route to the household's server. The APK path is the one under /work.
      - name: Run the journeys on apksim
        if: steps.key.outputs.present == 'true' && env.DEVICE == 'apksim'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          docker pull --quiet "$APKSIM_IMAGE"
          APKSIM="docker run --rm --network host -v $PWD:/work $APKSIM_IMAGE" ./scripts/run-android-cli-journeys.sh

      - name: Enable KVM
        if: steps.key.outputs.present == 'true' && env.DEVICE == 'emulator'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the journeys on an emulator
        if: steps.key.outputs.present == 'true' && env.DEVICE == 'emulator'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          # A phone's screen: the runner's default is 320x640, where the keyboard hides the sign-in form.
          profile: pixel_6
          # Drawing that screen in software starves the system on two cores: Pixel Launcher stopped
          # answering, and its "isn't responding" dialog took the agent's input over every journey.
          cores: 4
          ram-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            adb shell settings put global hide_error_dialogs 1
            ./scripts/run-android-cli-journeys.sh

      - name: Summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          [ -f build/journeys/summary.tsv ] || exit 0
          {
            echo "### Android CLI journeys on $DEVICE"
            echo
            echo "| Journey | Result | Actions | Seconds |"
            echo "|---|---|---|---|"
            awk -F'\t' '{ printf "| %s | %s | %s/%s | %s |\n", $1, ($2 == "pass" ? "✅" : "❌"), $3, $4, $5 }' build/journeys/summary.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: android-cli-journeys-${{ env.DEVICE }}
          path: build/journeys/**
          retention-days: 14
