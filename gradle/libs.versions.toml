[versions]
# 9.5 is still an alpha: it's what runs Compose Preview Screenshot Testing as an AGP test suite
# (androidApp/build.gradle.kts), which replaced the deprecated standalone screenshot plugin.
agp = "9.5.0-rc01"
android-compileSdk = "37"
android-minSdk = "33"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-biometric = "1.1.0"
androidx-fragment = "1.9.1"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-testRunner = "1.7.0"
androidx-testOrchestrator = "1.6.1"
composeMultiplatform = "1.12.0"
junit = "4.13.2"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
# Moves with composeMultiplatform, by hand: a material3 built for the next Compose brings that
# whole Compose in with it, over the version pinned above (.github/dependabot.yml leaves it alone).
material3 = "1.12.0-alpha03"
material-icons-extended = "1.7.3"
# Drag to reorder in lazy lists and grids (Calvin Liang), for the Home page's Arrange mode.
reorderable = "3.1.0"
metro = "1.5.0"
navigation3 = "1.1.2"
# Back as a gesture to animate with (NavigationBackHandler); the same dispatcher Navigation 3 feeds.
navigationevent = "1.1.0"
ksp = "2.3.12"
room = "3.0.3"
sqlite = "2.7.0"
ktor = "3.6.0"
cryptography = "0.6.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
media3 = "1.11.0"
# libwebrtc for Android, Stream's build of the upstream org.webrtc API (live view over WebRTC).
stream-webrtc = "1.3.10"
coil = "3.6.3"
# The desktop's video: FFmpeg, through JavaCV's frame grabber, for go2rtc's HLS and Frigate's
# recordings (DesktopVideoEngine.kt). The two move together: javacv x.y.z wants ffmpeg *-x.y.z.
javacv = "1.5.14"
# The Mac app calls its notifications library (desktopApp/macos/Notifications.swift) through it.
jna = "5.17.0"
ffmpeg = "8.1.2-1.5.14"

benchmark = "1.6.0-alpha01"
# In-process tracing (Tracing 2.0): Metro's binding spans and the app's own sections, written to a Perfetto
# file by the app (see HomeSafeApplication). Android only: androidx.tracing has no iOS target.
tracing = "2.0.5"
uiautomator = "2.4.0"
profileinstaller = "1.4.1"
composeStabilityAnalyzer = "0.15.0"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
composeRules = "0.6.8"
# Compose Preview Screenshot Testing's engine: renders :androidApp's @PreviewTest previews through
# Layoutlib, as the AGP test suite in androidApp/build.gradle.kts.
screenshot = "0.0.1-alpha16"

googleServices = "4.5.0"
playServicesLocation = "21.4.0"
firebaseBom = "34.18.0"
# The push path's picture and clip outlive the messaging service's callback; see HomeSafeMessagingService.
androidx-work = "2.12.0"
# Health Connect, where Google Health puts what a Fitbit band records (HealthSource.android.kt).
androidx-health-connect = "1.1.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-testRunner" }
# Runs each androidApp E2E test in its own instrumentation with the app's data cleared.
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidx-testOrchestrator" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }
compose-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "material-icons-extended" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-uiTestJunit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeMultiplatform" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Dispatchers.Main on the desktop: the AWT event thread Compose draws on.
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# Compose for the desktop, without a Skia for any one OS: :desktopApp picks that (see its build file).
compose-desktop = { module = "org.jetbrains.compose.desktop:desktop", version.ref = "composeMultiplatform" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# The fake Frigate the integration and end-to-end tests sign in to (:fake-frigate).
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "stream-webrtc" }
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacv" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "tracing" }
androidx-tracing-wire = { module = "androidx.tracing:tracing-wire", version.ref = "tracing" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "androidx-health-connect" }
# Geofencing + fused location for automatic presence (GeofenceMonitor.android.kt).
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }

# Compose-specific ktlint rules (mrmans0n/compose-rules), loaded via the ktlintRuleset configuration.
composeRules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRules" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidxRoom = { id = "androidx.room3", version.ref = "room" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
androidTest = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
composeStabilityAnalyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "composeStabilityAnalyzer" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
